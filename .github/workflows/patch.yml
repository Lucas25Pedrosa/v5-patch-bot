name: V5 Patch

on:
  workflow_dispatch:
    inputs:
      telegram_user_id:
        description: "Telegram user ID"
        required: true
        type: string

      telegram_chat_id:
        description: "Telegram chat ID"
        required: true
        type: string

      telegram_message_id:
        description: "Telegram /patch message ID"
        required: true
        type: string

      telegram_ipa_message_id:
        description: "Telegram IPA message ID"
        required: true
        type: string

      telegram_file_id:
        description: "Telegram file ID"
        required: true
        type: string

      telegram_file_unique_id:
        description: "Telegram unique file ID"
        required: true
        type: string

      ipa_filename:
        description: "Original IPA filename"
        required: true
        type: string

      ipa_filesize:
        description: "IPA size in bytes"
        required: true
        type: string

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Confirmar solicitação
        run: |
          echo "✅ Workflow disparado pelo Deno"
          echo "IPA Message ID: ${{ inputs.telegram_ipa_message_id }}"
          echo "Arquivo: ${{ inputs.ipa_filename }}"
          echo "Tamanho esperado: ${{ inputs.ipa_filesize }} bytes"

      - name: Baixar core privado
        uses: actions/checkout@v4
        with:
          repository: Lucas25Pedrosa/v5-patch-core
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: v5-core

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install telethon

      - name: Baixar IPA do Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          TELEGRAM_IPA_MESSAGE_ID: ${{ inputs.telegram_ipa_message_id }}
        run: |
          python v5-core/core/telegram_download.py

      - name: Validar IPA baixado
        env:
          EXPECTED_SIZE: ${{ inputs.ipa_filesize }}
        run: |
          set -euo pipefail

          if [ ! -f "work/input.ipa" ]; then
            echo "❌ work/input.ipa não encontrado"
            exit 1
          fi

          ACTUAL_SIZE=$(stat -c%s "work/input.ipa")

          echo "Tamanho esperado: $EXPECTED_SIZE bytes"
          echo "Tamanho baixado: $ACTUAL_SIZE bytes"

          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ]; then
            echo "❌ O tamanho do IPA não corresponde."
            exit 1
          fi

          echo "✅ Tamanho confirmado"

          echo
          echo "SHA-256:"
          sha256sum "work/input.ipa"

          echo
          echo "Espaço ocupado:"
          du -h "work/input.ipa"
