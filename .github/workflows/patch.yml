name: V5 Patch

on:
  workflow_dispatch:
    inputs:
      telegram_user_id:
        description: "Telegram user ID"
        required: true
        type: string

      telegram_chat_id:
        description: "Telegram chat ID"
        required: true
        type: string

      telegram_message_id:
        description: "Telegram /patch message ID"
        required: true
        type: string

      telegram_ipa_message_id:
        description: "Telegram IPA message ID"
        required: true
        type: string

      telegram_file_id:
        description: "Telegram file ID"
        required: true
        type: string

      telegram_file_unique_id:
        description: "Telegram unique file ID"
        required: true
        type: string

      ipa_filename:
        description: "Original IPA filename"
        required: true
        type: string

      ipa_filesize:
        description: "IPA size in bytes"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Confirmar disparo
        run: |
          echo "✅ Workflow disparado pelo Deno"
          echo "Telegram User ID: ${{ inputs.telegram_user_id }}"
          echo "Telegram Chat ID: ${{ inputs.telegram_chat_id }}"
          echo "Comando Message ID: ${{ inputs.telegram_message_id }}"
          echo "IPA Message ID: ${{ inputs.telegram_ipa_message_id }}"
          echo "Arquivo: ${{ inputs.ipa_filename }}"
          echo "Tamanho: ${{ inputs.ipa_filesize }} bytes"

      - name: Baixar core privado
        uses: actions/checkout@v4
        with:
          repository: Lucas25Pedrosa/v5-patch-core
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: v5-core

      - name: Confirmar core
        run: |
          echo "✅ Core privado carregado"
          find v5-core -maxdepth 2 -type f | sort
