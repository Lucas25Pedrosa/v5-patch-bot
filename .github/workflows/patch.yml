name: V5 Patch

on:
  workflow_dispatch:
    inputs:
      telegram_user_id:
        description: "Telegram user ID"
        required: true
        type: string
      telegram_chat_id:
        description: "Telegram chat ID"
        required: true
        type: string
      telegram_message_id:
        description: "Telegram /patch message ID"
        required: true
        type: string
      telegram_progress_message_id:
        description: "Telegram progress message ID"
        required: true
        type: string
      telegram_ipa_message_id:
        description: "Telegram IPA message ID"
        required: true
        type: string
      telegram_file_id:
        description: "Telegram file ID"
        required: true
        type: string
      telegram_file_unique_id:
        description: "Telegram unique file ID"
        required: true
        type: string
      ipa_filename:
        description: "Original IPA filename"
        required: true
        type: string
      ipa_filesize:
        description: "IPA size in bytes"
        required: true
        type: string

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Confirm request
        run: |
          echo "Telegram user: ${{ inputs.telegram_user_id }}"
          echo "Telegram chat: ${{ inputs.telegram_chat_id }}"
          echo "Progress message: ${{ inputs.telegram_progress_message_id }}"
          echo "IPA message: ${{ inputs.telegram_ipa_message_id }}"
          echo "File: ${{ inputs.ipa_filename }}"
          echo "Expected size: ${{ inputs.ipa_filesize }} bytes"

      - name: Checkout private core
        uses: actions/checkout@v4
        with:
          repository: Lucas25Pedrosa/v5-patch-core
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: v5-core
          persist-credentials: false

      - name: Validate private core
        run: |
          set -euo pipefail
          test -f v5-core/core/telegram_progress.py
          test -f v5-core/core/telegram_download.py
          test -f v5-core/core/v5_patch.py
          test -f v5-core/core/telegram_send.py
          echo "Private core validated"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon

      - name: Download IPA from Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_SESSION: ${{ secrets.TELEGRAM_BOT_SESSION }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          TELEGRAM_IPA_MESSAGE_ID: ${{ inputs.telegram_ipa_message_id }}
          TELEGRAM_PROGRESS_MESSAGE_ID: ${{ inputs.telegram_progress_message_id }}
          IPA_FILENAME: ${{ inputs.ipa_filename }}
        run: |
          python v5-core/core/telegram_download.py

      - name: Validate downloaded IPA
        env:
          EXPECTED_SIZE: ${{ inputs.ipa_filesize }}
        run: |
          set -euo pipefail
          test -f work/input.ipa
          ACTUAL_SIZE=$(stat -c%s work/input.ipa)
          echo "Expected: $EXPECTED_SIZE bytes"
          echo "Actual:   $ACTUAL_SIZE bytes"
          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ]; then
            echo "Downloaded size mismatch"
            exit 1
          fi
          python - <<'PY'
          import zipfile
          path = "work/input.ipa"
          if not zipfile.is_zipfile(path):
              raise SystemExit("Input is not a valid ZIP/IPA")
          with zipfile.ZipFile(path) as archive:
              bad = archive.testzip()
          if bad:
              raise SystemExit(f"Corrupted member: {bad}")
          print("Input IPA validated")
          PY

      - name: Show applying patch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          TELEGRAM_PROGRESS_MESSAGE_ID: ${{ inputs.telegram_progress_message_id }}
          IPA_FILENAME: ${{ inputs.ipa_filename }}
        run: |
          python v5-core/core/telegram_progress.py \
            --stage patch \
            --metadata work/metadata.json

      - name: Apply V5 NoPopup
        run: |
          python v5-core/core/v5_patch.py \
            work/input.ipa \
            work/output.ipa \
            --status-file work/v5-status.json

      - name: Show validating IPA
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          TELEGRAM_PROGRESS_MESSAGE_ID: ${{ inputs.telegram_progress_message_id }}
          IPA_FILENAME: ${{ inputs.ipa_filename }}
        run: |
          python v5-core/core/telegram_progress.py \
            --stage validate \
            --metadata work/metadata.json

      - name: Validate V5 result
        run: |
          python - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path

          input_path = Path("work/input.ipa")
          output_path = Path("work/output.ipa")
          status_path = Path("work/v5-status.json")

          if not output_path.is_file():
              raise SystemExit("work/output.ipa was not created")
          if not status_path.is_file():
              raise SystemExit("work/v5-status.json was not created")

          status = json.loads(status_path.read_text(encoding="utf-8"))
          if not status.get("ok"):
              raise SystemExit(f"V5 failed: {status}")
          if status.get("status") not in {"applied", "already_applied"}:
              raise SystemExit(f"Unexpected V5 status: {status.get('status')}")

          if not zipfile.is_zipfile(output_path):
              raise SystemExit("Output is not a valid ZIP/IPA")

          with zipfile.ZipFile(input_path) as before, zipfile.ZipFile(output_path) as after:
              if before.namelist() != after.namelist():
                  raise SystemExit("IPA member structure changed")

              changed = []
              for name in before.namelist():
                  old_hash = hashlib.sha256(before.read(name)).digest()
                  new_hash = hashlib.sha256(after.read(name)).digest()
                  if old_hash != new_hash:
                      changed.append(name)

              target = status["ipa_member"]
              if status["status"] == "applied" and changed != [target]:
                  raise SystemExit(f"Unexpected changed members: {changed}")
              if status["status"] == "already_applied" and changed:
                  raise SystemExit(f"Already-applied IPA changed unexpectedly: {changed}")

              bad = after.testzip()
              if bad:
                  raise SystemExit(f"Corrupted output member: {bad}")

          print("V5 output validated")
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - name: Upload patched IPA to Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_SESSION: ${{ secrets.TELEGRAM_BOT_SESSION }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          TELEGRAM_PROGRESS_MESSAGE_ID: ${{ inputs.telegram_progress_message_id }}
        run: |
          python v5-core/core/telegram_send.py

      - name: Show failure in Telegram
        if: ${{ failure() }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id }}
          TELEGRAM_PROGRESS_MESSAGE_ID: ${{ inputs.telegram_progress_message_id }}
          IPA_FILENAME: ${{ inputs.ipa_filename }}
        run: |
          python v5-core/core/telegram_progress.py \
            --stage failed \
            --metadata work/metadata.json
