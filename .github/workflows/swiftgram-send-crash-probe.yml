name: Build Swiftgram Send Probe

"on":
  workflow_dispatch:
  push:
    paths:
      - "swiftgram-send-crash-probe/**"
      - ".github/workflows/swiftgram-send-crash-probe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: swiftgram-send-crash-probe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: |
          brew install ldid

      - name: Build arm64 probe
        run: |
          set -euo pipefail
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          mkdir -p artifacts
          dylib_path="$(find .theos -type f -name SwiftgramSendCrashProbe.dylib -print -quit)"
          test -n "$dylib_path"
          cp "$dylib_path" artifacts/SwiftgramSendCrashProbe.dylib
          shasum -a 256 artifacts/SwiftgramSendCrashProbe.dylib > artifacts/SwiftgramSendCrashProbe.SHA256.txt
          file artifacts/SwiftgramSendCrashProbe.dylib

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: SwiftgramSendCrashProbe-0.1-arm64
          path: swiftgram-send-crash-probe/artifacts/
          if-no-files-found: error

      - name: Publish test build
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p build-output/iqtele
          cp swiftgram-send-crash-probe/artifacts/SwiftgramSendCrashProbe.dylib build-output/iqtele/SwiftgramSendCrashProbe.dylib
          cp swiftgram-send-crash-probe/artifacts/SwiftgramSendCrashProbe.SHA256.txt build-output/iqtele/SwiftgramSendCrashProbe.SHA256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/iqtele/SwiftgramSendCrashProbe.dylib build-output/iqtele/SwiftgramSendCrashProbe.SHA256.txt
          if ! git diff --cached --quiet; then
            git commit -m "Build Swiftgram send diagnostic probe"
            git push
          fi
