name: Build XLiquidGlass Beta 6.2 Comments Visible Legacy

on:
  push:
    paths:
      - 'x-liquid-glass-only/**'
      - 'scripts/patch_xlg_comments_visible_legacy_beta62.py'
      - '.github/workflows/x-liquid-glass-comments-visible-legacy-beta62.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Beta 6.2 comments visible legacy patch
        run: python3 scripts/patch_xlg_comments_visible_legacy_beta62.py

      - name: Verify Beta 6.2 markers
        run: |
          grep -n 'gXLGCommentsLegacyVisible = YES' x-liquid-glass-only/XLiquidGlass.m
          grep -n 'gXLGCommentsLegacyVisible = NO' x-liquid-glass-only/XLiquidGlass.m
          grep -n 'XLGCommentsVisibleLegacyBeta62Init' x-liquid-glass-only/XLiquidGlass.m
          grep -n 'T1ConversationContainerViewController' x-liquid-glass-only/XLiquidGlass.m

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install signing tool
        run: brew install ldid

      - name: Build XLiquidGlass Beta 6.2
        working-directory: x-liquid-glass-only
        run: |
          make clean
          make FINALPACKAGE=1
          mkdir -p ../build-xlg-comments-visible-beta62
          cp .theos/obj/debug/XLiquidGlass.dylib ../build-xlg-comments-visible-beta62/XLiquidGlass-2.0.2-Beta6.2-CommentsVisibleLegacy-arm64.dylib || \
          cp .theos/obj/XLiquidGlass.dylib ../build-xlg-comments-visible-beta62/XLiquidGlass-2.0.2-Beta6.2-CommentsVisibleLegacy-arm64.dylib
          file ../build-xlg-comments-visible-beta62/XLiquidGlass-2.0.2-Beta6.2-CommentsVisibleLegacy-arm64.dylib
          shasum -a 256 ../build-xlg-comments-visible-beta62/XLiquidGlass-2.0.2-Beta6.2-CommentsVisibleLegacy-arm64.dylib > ../build-xlg-comments-visible-beta62/XLiquidGlass-2.0.2-Beta6.2-CommentsVisibleLegacy-SHA256SUMS.txt

      - name: Upload XLiquidGlass Beta 6.2
        uses: actions/upload-artifact@v4
        with:
          name: XLiquidGlass-2.0.2-Beta6.2-CommentsVisibleLegacy-arm64
          path: build-xlg-comments-visible-beta62/*
          if-no-files-found: error
