name: Build Nexus 1.0.2 PT-BR Functional Translation Neutralized

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/nexus-102-functional-translation-neutralized.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout exact functional source
        uses: actions/checkout@v5
        with:
          ref: 9dea598f152b644b82e2ce5013248ad26a6db669

      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: brew install ldid

      - name: Build exact functional Nexus with translation behavior neutralized
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 nexus/patch_presentation_v2.py nexus/NexusSettings.m
          cp nexus/prepare_makefile_v2.py nexus/prepare_makefile.py

          python3 - <<'PY'
          from pathlib import Path

          p = Path("nexus/build.sh")
          s = p.read_text(encoding="utf-8")

          # Reproduce the known-working run #52 pipeline.
          s = s.replace("grep -F 'Alterar ícone' \"$ARTIFACTS/strings.txt\"\n", "")
          needle = 'python3 "$ROOT/nexus/prepare_enhancer.py" "$WORK/EnhancerTweak.m" "$WORK/Translation.m"\n'
          sync = 'python3 "$ROOT/nexus/sync_translation_11.py" "$WORK/Translation.m" "$ROOT/iqface-enhancer-1.1/Localization11.m"\n'
          timing = 'python3 "$ROOT/nexus/patch_translation_timing.py" "$WORK/Translation.m"\n'
          replacement = needle + sync + timing
          if needle not in s:
              raise RuntimeError("prepare_enhancer invocation not found")
          s = s.replace(needle, replacement, 1)

          # Keep Translation.m linked and keep its constructor/lifecycle hooks,
          # but empty the actual translation table and neutralize the PT-BR-only
          # label-width adjustment. This preserves the working load path.
          neutralize = r'''python3 - "$WORK/Translation.m" <<'PY2'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          src = p.read_text(encoding="utf-8")

          func = "static NSDictionary<NSString *, NSString *> *IQFPortugueseUIStrings(void)"
          fpos = src.find(func)
          if fpos < 0:
              raise SystemExit("translation function not found")

          marker = "translations = @{"
          dstart = src.find(marker, fpos)
          if dstart < 0:
              raise SystemExit("translation dictionary start not found")
          body_start = dstart + len(marker)
          body_end = src.find("\n        };", body_start)
          if body_end < 0:
              raise SystemExit("translation dictionary end not found")
          src = src[:body_start] + "\n" + src[body_end:]

          helper = "static void IQFFixTranslatedListLabelWidth(UILabel *label) {"
          hstart = src.find(helper)
          if hstart < 0:
              raise SystemExit("translation width helper not found")
          hend_marker = "\n}\n\nstatic void IQFTranslateViewTree"
          hend = src.find(hend_marker, hstart)
          if hend < 0:
              raise SystemExit("translation width helper end not found")
          stub = "static void IQFFixTranslatedListLabelWidth(UILabel *label) {\n    (void)label;\n}"
          src = src[:hstart] + stub + src[hend + 2:]

          p.write_text(src, encoding="utf-8")
          print("Translation table neutralized; constructor and hook lifecycle preserved")
          PY2
          '''

          if timing not in s:
              raise RuntimeError("translation timing marker not found")
          s = s.replace(timing, timing + neutralize, 1)

          p.write_text(s, encoding="utf-8")
          PY

          bash nexus/build.sh

      - name: Verify functional structure and no visible PT-BR translation table
        run: |
          set -euo pipefail
          STR="nexus/artifacts/strings.txt"

          grep -F 'v1.0.2' "$STR"
          grep -F '1.1-core-ptbr' "$STR"
          grep -F 'iqfDismiss' "$STR"
          grep -F 'iqf_tapped' "$STR"
          grep -F 'IQFIconsPickerController' "$STR"
          grep -F 'Modo OLED' "$STR"
          grep -F 'Separadores no feed' "$STR"
          grep -F 'Limpar cache' "$STR"
          grep -F 'nexus_avatar_addSubview:' "$STR"
          grep -F 'nexus_avatar_setImage:' "$STR"

          ! grep -F 'Bloquear anúncios em vídeos' "$STR"
          ! grep -F 'Ocultar publicações sugeridas' "$STR"
          ! grep -F 'Modo fantasma nos stories' "$STR"
          ! grep -F 'Confirmar envio de mensagens' "$STR"

      - name: Upload Nexus
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-1.0.2-PTBR-Functional-Translation-Neutralized-arm64
          path: nexus/artifacts/
          if-no-files-found: error
