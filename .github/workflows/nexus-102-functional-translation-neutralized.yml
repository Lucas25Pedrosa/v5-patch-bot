name: Build Nexus 1.0.2 PT-BR Functional Translation Neutralized

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/nexus-102-functional-translation-neutralized.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout exact functional source
        uses: actions/checkout@v5
        with:
          ref: 9dea598f152b644b82e2ce5013248ad26a6db669

      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: brew install ldid

      - name: Build exact functional Nexus with translation behavior neutralized
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 nexus/patch_presentation_v2.py nexus/NexusSettings.m
          cp nexus/prepare_makefile_v2.py nexus/prepare_makefile.py

          python3 - <<'PY'
          from pathlib import Path

          p = Path("nexus/build.sh")
          s = p.read_text(encoding="utf-8")

          # Reproduce run #52 exactly first.
          s = s.replace("grep -F 'Alterar ícone' \"$ARTIFACTS/strings.txt\"\n", "")
          needle = 'python3 "$ROOT/nexus/prepare_enhancer.py" "$WORK/EnhancerTweak.m" "$WORK/Translation.m"\n'
          sync = 'python3 "$ROOT/nexus/sync_translation_11.py" "$WORK/Translation.m" "$ROOT/iqface-enhancer-1.1/Localization11.m"\n'
          timing = 'python3 "$ROOT/nexus/patch_translation_timing.py" "$WORK/Translation.m"\n'
          replacement = needle + sync + timing
          if needle not in s:
              raise RuntimeError("prepare_enhancer invocation not found")
          s = s.replace(needle, replacement, 1)

          # Keep Translation.m linked, its constructor and lifecycle hooks intact,
          # but neutralize only the translation table and PT-BR layout behavior.
          neutralize = r'''python3 - "$WORK/Translation.m" <<'PY2'
          from pathlib import Path
          import re, sys

          p = Path(sys.argv[1])
          src = p.read_text(encoding="utf-8")

          # Remove all English->Portuguese mappings while preserving the object,
          # constructor, hooks and exported/runtime structure from the functional build.
          pat = re.compile(
              r'(static NSDictionary<NSString \\*, NSString \\*> \\*IQFPortugueseUIStrings\\(void\\) \\{.*?translations = @\\{)(.*?)(\\n        \\};)',
              flags=re.S,
          )
          m = pat.search(src)
          if not m:
              raise SystemExit("translation dictionary not found")
          src = src[:m.start(2)] + '' + src[m.end(2):]

          # Preserve the function call/site so object layout remains close to the
          # functional build, but make the PT-BR-only width adjustment inert.
          helper = re.compile(
              r'static void IQFFixTranslatedListLabelWidth\\(UILabel \\*label\\) \\{.*?\\n\\}',
              flags=re.S,
          )
          src, n = helper.subn(
              'static void IQFFixTranslatedListLabelWidth(UILabel *label) {\\n    (void)label;\\n}',
              src,
              count=1,
          )
          if n != 1:
              raise SystemExit("translation label helper not found")

          p.write_text(src, encoding="utf-8")
          print("Translation behavior neutralized; Translation.m object/hook lifecycle preserved")
          PY2
          '''

          marker = timing
          if marker not in s:
              raise RuntimeError("translation timing marker not found")
          s = s.replace(marker, marker + neutralize, 1)

          # Original binary validations that specifically require PT-BR strings
          # must now verify their absence instead.
          s = s.replace("grep -F 'RECURSOS' \"$ARTIFACTS/strings.txt\"\n", "! grep -F 'RECURSOS' \"$ARTIFACTS/strings.txt\"\n")

          # Keep the legacy marker because the Translation.m object itself remains
          # linked intentionally to preserve the known-working load-time structure.
          p.write_text(s, encoding="utf-8")
          PY

          bash nexus/build.sh

      - name: Verify exact functional structure minus visible translation
        run: |
          set -euo pipefail
          BIN="nexus/artifacts/Nexus.dylib"
          STR="nexus/artifacts/strings.txt"

          grep -F 'v1.0.2' "$STR"
          grep -F '1.1-core-ptbr' "$STR"
          grep -F 'iqfDismiss' "$STR"
          grep -F 'iqf_tapped' "$STR"
          grep -F 'IQFIconsPickerController' "$STR"
          grep -F 'Modo OLED' "$STR"
          grep -F 'Separadores no feed' "$STR"
          grep -F 'Limpar cache' "$STR"
          grep -F 'nexus_avatar_addSubview:' "$STR"
          grep -F 'nexus_avatar_setImage:' "$STR"

          # Representative old iQFace translation strings must be gone.
          ! grep -F 'Bloquear anúncios em vídeos' "$STR"
          ! grep -F 'Ocultar publicações sugeridas' "$STR"
          ! grep -F 'Modo fantasma nos stories' "$STR"
          ! grep -F 'Confirmar envio de mensagens' "$STR"

      - name: Upload Nexus
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-1.0.2-PTBR-Functional-Translation-Neutralized-arm64
          path: nexus/artifacts/
          if-no-files-found: error
