name: Build XTranslate Probe

"on":
  workflow_dispatch:
  push:
    branches:
      - "xtranslate-probe-*"
    paths:
      - "xtranslate-probe/**"
      - ".github/workflows/xtranslate-probe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: xtranslate-probe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: brew install ldid

      - name: Build and validate arm64 dylib
        run: |
          set -euo pipefail
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          mkdir -p artifacts
          dylib_path="$(find .theos -type f -name XTranslateProbe.dylib ! -path '*/XTranslateProbe.dylib.dSYM/*' -print -quit)"
          test -n "$dylib_path"
          cp "$dylib_path" artifacts/XTranslateProbe-0.1.0-X12.31.1-arm64.dylib
          file artifacts/XTranslateProbe-0.1.0-X12.31.1-arm64.dylib
          lipo -info artifacts/XTranslateProbe-0.1.0-X12.31.1-arm64.dylib
          otool -hv artifacts/XTranslateProbe-0.1.0-X12.31.1-arm64.dylib
          shasum -a 256 artifacts/XTranslateProbe-0.1.0-X12.31.1-arm64.dylib > artifacts/SHA256SUMS.txt

      - name: Upload XTranslate Probe
        uses: actions/upload-artifact@v4
        with:
          name: XTranslateProbe-0.1.0-X12.31.1-arm64
          path: xtranslate-probe/artifacts/
          if-no-files-found: error
