name: Build iQKeepDeleted Exceptions Probe

"on":
  workflow_dispatch:
  push:
    paths:
      - "iqkeep-exceptions-probe/**"
      - ".github/workflows/iqkeep-exceptions-probe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: iqkeep-exceptions-probe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: |
          brew install ldid

      - name: Build arm64 diagnostic dylib
        run: |
          set -euo pipefail
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          mkdir -p artifacts
          dylib_path="$(find .theos -type f -name iQKeepDeletedExceptionsProbe.dylib -print -quit)"
          test -n "$dylib_path"
          cp "$dylib_path" artifacts/iQKeepDeletedExceptionsProbe.dylib
          shasum -a 256 artifacts/iQKeepDeletedExceptionsProbe.dylib > artifacts/iQKeepDeletedExceptionsProbe.SHA256.txt

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: iQKeepDeletedExceptionsProbe-arm64
          path: iqkeep-exceptions-probe/artifacts/
          if-no-files-found: error

      - name: Publish test build
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p build-output/iqtele
          cp iqkeep-exceptions-probe/artifacts/iQKeepDeletedExceptionsProbe.dylib build-output/iqtele/iQKeepDeletedExceptionsProbe.dylib
          cp iqkeep-exceptions-probe/artifacts/iQKeepDeletedExceptionsProbe.SHA256.txt build-output/iqtele/iQKeepDeletedExceptionsProbe.SHA256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/iqtele/iQKeepDeletedExceptionsProbe.dylib build-output/iqtele/iQKeepDeletedExceptionsProbe.SHA256.txt
          if ! git diff --cached --quiet; then
            git commit -m "Build iQKeepDeleted exceptions diagnostic probe"
            git push
          fi
