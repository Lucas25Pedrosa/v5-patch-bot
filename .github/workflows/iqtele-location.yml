name: Temporary iQKeepDeletedExceptionsProbe 0.2 Build

"on":
  push:
    paths:
      - "iqkeep-deleted-exceptions-probe/**"
      - ".github/workflows/iqtele-location.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: iqkeep-deleted-exceptions-probe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
      - name: Install signing tool
        run: brew install ldid
      - name: Build probe dylib
        run: |
          set -euo pipefail
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          mkdir -p artifacts
          dylib_path="$(find .theos -type f -name iQKeepDeletedExceptionsProbe.dylib -print -quit)"
          test -n "$dylib_path"
          cp "$dylib_path" artifacts/iQKeepDeletedExceptionsProbe.dylib
          shasum -a 256 artifacts/iQKeepDeletedExceptionsProbe.dylib > artifacts/SHA256SUMS.txt
          file artifacts/iQKeepDeletedExceptionsProbe.dylib
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: iQKeepDeletedExceptionsProbe-0.2-arm64
          path: iqkeep-deleted-exceptions-probe/artifacts/
          if-no-files-found: error
