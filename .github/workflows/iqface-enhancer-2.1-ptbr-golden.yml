name: Build iQFaceEnhancer 2.1 PT-BR Golden

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/iqface-enhancer-2.1-ptbr-golden.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install ldid
        run: brew install ldid

      - name: Reconstruct exact working beta source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/iqface-golden-base"
          PT="$RUNNER_TEMP/iqface-golden-ptbr"
          mkdir -p "$BASE" "$PT"

          # Exact Tweak.m blob used by the working beta.
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/636fea8908d802e4189e61fb292c9f42ad668973" \
            | python3 -c 'import sys,json,base64; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' \
            > "$BASE/Tweak.m"

          # Exact WordmarkActivation.m blob used by the working beta.
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/cf0e1fcb8809cf64564bce78d64fb03bbb91a50e" \
            | python3 -c 'import sys,json,base64; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' \
            > "$BASE/WordmarkActivation.m"

          # Apply only the exact three source transforms from the working beta workflow.
          python3 - "$BASE/Tweak.m" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()

          s = s.replace("static void IQFOpenSettings(void) {", "void IQFOpenSettings(void) {", 1)

          pattern = r"static void IQFAttachLongPress\(UIView \*view\) \{.*?\n\}"
          replacement = "static void IQFAttachLongPress(UIView *view) {\n    (void)view;\n    (void)IQFGestureAssociationKey;\n    (void)IQFLongPressDuration;\n}"
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          assert n == 1

          needle = "        if (!IQFSafeModeEnabled()) {\n            IQFInstallNavigationItemHooks();\n            IQFInstallTabBarHooks();\n        }\n"
          guard = "        IQFReplaceMethod(UIView.class, @selector(addSubview:), (IMP)&IQFAddSubview, (IMP *)&IQFOriginalAddSubview);\n\n"
          assert needle in s
          s = s.replace(needle, guard + needle, 1)

          assert 'IQFFindSymbol("IQFPresentSettings")' in s
          assert 'IQFPresentLauncherMenu' not in s
          open(p, "w", encoding="utf-8").write(s)
          PY

          cat > "$BASE/Makefile" <<'EOF'
          ARCHS = arm64
          TARGET = iphone:clang:latest:14.0
          include $(THEOS)/makefiles/common.mk
          LIBRARY_NAME = iQFaceEnhancer
          iQFaceEnhancer_FILES = Tweak.m WordmarkActivation.m
          iQFaceEnhancer_FRAMEWORKS = Foundation UIKit QuartzCore
          iQFaceEnhancer_CFLAGS = -fobjc-arc -Wall -Wextra
          iQFaceEnhancer_LDFLAGS = -Wl,-install_name,@rpath/iQFaceEnhancer.dylib
          iQFaceEnhancer_INSTALL_PATH = /Library/MobileSubstrate/DynamicLibraries
          include $(THEOS_MAKE_PATH)/library.mk
          EOF

          # Clone exact reconstructed working source, then make ONE functional change:
          # allow the existing original localization installer to run in Safe Mode.
          cp "$BASE/Tweak.m" "$PT/Tweak.m"
          cp "$BASE/WordmarkActivation.m" "$PT/WordmarkActivation.m"
          cp "$BASE/Makefile" "$PT/Makefile"

          python3 - "$PT/Tweak.m" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          old = '''        dispatch_async(dispatch_get_main_queue(), ^{
            if (!IQFSafeModeEnabled()) {
                IQFTryInstallIQFaceHooks();
                IQFCleanVisibleSettingsItems();
            }
        });'''
          new = '''        dispatch_async(dispatch_get_main_queue(), ^{
            IQFTryInstallIQFaceHooks();
            if (!IQFSafeModeEnabled()) {
                IQFCleanVisibleSettingsItems();
            }
        });'''
          assert old in s
          s = s.replace(old, new, 1)
          open(p, "w", encoding="utf-8").write(s)
          PY

          # Prove the source delta is only that localization-install decision.
          diff -u "$BASE/Tweak.m" "$PT/Tweak.m" > "$RUNNER_TEMP/source-diff.txt" || true
          cat "$RUNNER_TEMP/source-diff.txt"
          test "$(grep -c '^[-+]' "$RUNNER_TEMP/source-diff.txt")" -le 8

      - name: Build baseline reproduction
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/iqface-golden-base"
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          dylib="$(find .theos -type f -name iQFaceEnhancer.dylib -print -quit)"
          test -n "$dylib"
          shasum -a 256 "$dylib"
          sha="$(shasum -a 256 "$dylib" | awk '{print $1}')"
          echo "BASE_SHA=$sha" >> "$GITHUB_ENV"

      - name: Build PT-BR 1-to-1 variant
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/iqface-golden-ptbr"
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          dylib="$(find .theos -type f -name iQFaceEnhancer.dylib -print -quit)"
          test -n "$dylib"
          mkdir -p artifacts
          cp "$dylib" artifacts/iQFaceEnhancer2.1-PTBR.dylib
          cp "$RUNNER_TEMP/source-diff.txt" artifacts/SOURCE-DELTA.txt
          file artifacts/iQFaceEnhancer2.1-PTBR.dylib
          shasum -a 256 artifacts/iQFaceEnhancer2.1-PTBR.dylib > artifacts/SHA256SUMS.txt
          strings -a artifacts/iQFaceEnhancer2.1-PTBR.dylib > artifacts/strings.txt || true

          # Required original localization mechanism and known translations.
          grep -q "IQFLoc" artifacts/strings.txt
          grep -q "MSHookFunction" artifacts/strings.txt
          grep -q "Ajustes do iQFace" artifacts/strings.txt
          grep -q "Bloquear anúncios" artifacts/strings.txt
          grep -q "Baixar vídeos" artifacts/strings.txt

          # Working activation must remain unchanged.
          grep -q "IQFPresentSettings" artifacts/strings.txt
          grep -q "FBNavigationBar" artifacts/strings.txt
          grep -q "iqf_tapped" artifacts/strings.txt
          ! grep -q "IQFPresentLauncherMenu" artifacts/strings.txt

          printf 'Uploaded golden SHA256: 13848d1f813ba6fe13434f87fa2a92c4f039b140acd6d22168ebf74baa43c98d\nRebuilt baseline SHA256: %s\n' "$BASE_SHA" > artifacts/GOLDEN-CHECK.txt

      - name: Upload PT-BR dylib
        uses: actions/upload-artifact@v4
        with:
          name: iQFaceEnhancer2.1-PTBR
          path: ${{ runner.temp }}/iqface-golden-ptbr/artifacts/
          if-no-files-found: error
