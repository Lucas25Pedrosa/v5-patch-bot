name: Build XSoccerGameday

on:
  workflow_dispatch:
  push:
    paths:
      - "x-soccer-gameday/**"
      - ".github/workflows/x-soccer-gameday.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: x-soccer-gameday

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: brew install ldid

      - name: Build XSoccerGameday dylib
        run: |
          set -euo pipefail

          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"

          mkdir -p artifacts

          dylib_path="$(find .theos \
            -type f \
            -name XSoccerGameday.dylib \
            ! -path '*/XSoccerGameday.dylib.dSYM/*' \
            -print -quit)"

          test -n "$dylib_path"

          cp "$dylib_path" artifacts/XSoccerGameday.dylib

          file artifacts/XSoccerGameday.dylib
          shasum -a 256 artifacts/XSoccerGameday.dylib \
            > artifacts/SHA256SUMS.txt

      - name: Upload XSoccerGameday dylib
        uses: actions/upload-artifact@v4
        with:
          name: XSoccerGameday-1.0.0-arm64
          path: x-soccer-gameday/artifacts/
          if-no-files-found: error
