name: Build iQFace Cache

"on":
  workflow_dispatch:
  push:
    paths:
      - "iqface-cache/**"
      - ".github/workflows/iqface-cache.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: iqface-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: |
          brew install ldid

      - name: Prepare beta 2 source
        run: |
          set -euo pipefail
          python3 prepare_beta2.py
          grep -F "iQFaceCache 0.2.0-beta2" Tweak.m
          grep -F "86400.0" Tweak.m
          grep -F "604800.0" Tweak.m
          grep -F "2592000.0" Tweak.m
          grep -F "Limpeza automática — Beta 2" Tweak.m
          if grep -F "return IQFCCacheAutomaticMode() == IQFCCacheAutoModeNever ? 0.0 : 3600.0;" Tweak.m; then
            echo "Unexpected beta 1 one-hour interval"
            exit 1
          fi

      - name: Build arm64 dylib
        run: |
          set -euo pipefail
          grep -F "Serão removidos aproximadamente" Tweak.m
          grep -F "Cache limpo" Tweak.m
          grep -F "Limpar cache automaticamente" Tweak.m
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          mkdir -p artifacts
          dylib_path="$(find .theos -type f -name iQFaceCache.dylib -print -quit)"
          test -n "$dylib_path"
          cp "$dylib_path" artifacts/iQFaceCache.dylib
          shasum -a 256 artifacts/iQFaceCache.dylib > artifacts/SHA256SUMS.txt
          file artifacts/iQFaceCache.dylib
          strings -a artifacts/iQFaceCache.dylib | grep -F "Limpar cache"
          strings -a artifacts/iQFaceCache.dylib | grep -F "Limpar cache automaticamente"
          strings -a artifacts/iQFaceCache.dylib | grep -F "Beta 2"
          if strings -a artifacts/iQFaceCache.dylib | grep -F "UILongPressGestureRecognizer"; then
            echo "Unexpected gesture recognizer in iQFaceCache"
            exit 1
          fi

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: iQFaceCache-0.2.0-beta2-arm64
          path: iqface-cache/artifacts/
          if-no-files-found: error
          retention-days: 3
