name: Build iQFace Cache

"on":
  workflow_dispatch:
  push:
    paths:
      - "iqface-cache/**"
      - ".github/workflows/iqface-cache.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: iqface-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: |
          brew install ldid

      - name: Build and validate arm64 dylib
        run: |
          set -euo pipefail

          grep -F "iQFaceCache 0.2.1" Tweak.m
          grep -F 'NSClassFromString(@"IQFTweakSettings")' Tweak.m
          grep -F "class_getClassMethod" Tweak.m
          grep -F "buttonCellWithTitle:subtitle:icon:action:" Tweak.m
          grep -F "optionsCellWithTitle:subtitle:icon:defaultsKey:defaultValue:options:" Tweak.m
          grep -F "Limpar cache automaticamente" Tweak.m
          grep -F "Diariamente" Tweak.m
          grep -F "Semanalmente" Tweak.m
          grep -F "Mensalmente" Tweak.m
          grep -F "Serão removidos aproximadamente" Tweak.m
          grep -F "✓ Cache limpo" Tweak.m

          if grep -Fq "viewWillAppear:" Tweak.m; then
            echo "Unexpected view lifecycle settings hook"
            exit 1
          fi
          if grep -Fq "setSections:" Tweak.m; then
            echo "Unexpected runtime setSections mutation"
            exit 1
          fi

          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"

          mkdir -p artifacts
          dylib_path="$(find .theos -type f -name iQFaceCache.dylib -print -quit)"
          test -n "$dylib_path"
          cp "$dylib_path" artifacts/iQFaceCache.dylib
          shasum -a 256 artifacts/iQFaceCache.dylib > artifacts/SHA256SUMS.txt
          file artifacts/iQFaceCache.dylib
          strings -a artifacts/iQFaceCache.dylib > artifacts/strings.txt || true

          require_string() {
            local value="$1"
            grep -Fq "$value" artifacts/strings.txt || { echo "MISSING REQUIRED: $value"; exit 1; }
            echo "FOUND: $value"
          }

          forbid_string() {
            local value="$1"
            ! grep -Fq "$value" artifacts/strings.txt || { echo "UNEXPECTED: $value"; exit 1; }
            echo "ABSENT AS EXPECTED: $value"
          }

          require_string "IQFTweakSettings"
          require_string "IQFSetting"
          require_string "buttonCellWithTitle:subtitle:icon:action:"
          require_string "optionsCellWithTitle:subtitle:icon:defaultsKey:defaultValue:options:"
          require_string "IQFPrefs"
          require_string "integerForKey:defaultValue:"
          require_string "setInteger:forKey:"
          require_string "FERRAMENTAS"
          require_string "Limpar cache"
          require_string "Limpar cache automaticamente"
          require_string "Desativado"
          require_string "Diariamente"
          require_string "Semanalmente"
          require_string "Mensalmente"
          require_string "Approximately"
          require_string "com.facebook.Facebook.MosaicIGImageDiskCache"

          forbid_string "valueRowWithTitle:icon:detail:tap:"
          forbid_string "setSections:"
          forbid_string "viewWillAppear:"
          forbid_string "UILongPressGestureRecognizer"

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: iQFaceCache-0.2.1-iQFace-1.1-arm64
          path: iqface-cache/artifacts/
          if-no-files-found: error
