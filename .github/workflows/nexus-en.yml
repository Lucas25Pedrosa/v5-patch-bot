name: Build Nexus 1.0 English

"on":
  workflow_dispatch:
  push:
    paths:
      - "nexus-en/**"
      - ".github/workflows/nexus-en.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: brew install ldid

      - name: Prepare Enhancer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nexus-en-build"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/636fea8908d802e4189e61fb292c9f42ad668973" \
            | python3 -c 'import sys,json,base64; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' \
            > "$WORK/EnhancerTweak.m"
          python3 nexus-en/prepare_enhancer.py "$WORK/EnhancerTweak.m"
          cp iqface-enhancer-wordmark-beta/WordmarkActivation.m "$WORK/WordmarkActivation.m"
          cp iqface-enhancer-1.1/HideButton11.m "$WORK/HideButton11.m"

      - name: Prepare English modules
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nexus-en-build"
          python3 nexus-en/prepare_cache.py iqface-cache-en/Tweak.m "$WORK/CacheTweak.m"
          python3 nexus-en/prepare_icons.py iqface-icons-en/Tweak.m "$WORK/IconsTweak.m"
          cp iqface-icons-en/IconPicker.m "$WORK/IconsPicker.m"

      - name: Download validated English OLED source
        uses: actions/download-artifact@v4
        with:
          name: iQFaceOLED-en-0.2.5-iQFace-1.1-arm64
          repository: ${{ github.repository }}
          run-id: 34735836621
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/nexus-en-oled

      - name: Assemble Nexus English sources
        run: python3 nexus-en/assemble.py "$RUNNER_TEMP/nexus-en-build" "$RUNNER_TEMP/nexus-en-oled/Tweak.m"

      - name: Build Nexus English
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nexus-en-build"
          cd "$WORK"
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          mkdir -p "$GITHUB_WORKSPACE/nexus-en/artifacts"
          rm -f "$GITHUB_WORKSPACE/nexus-en/artifacts"/*
          DYLIB_PATH="$(find .theos -type f -name Nexus.dylib -print -quit)"
          test -n "$DYLIB_PATH"
          cp "$DYLIB_PATH" "$GITHUB_WORKSPACE/nexus-en/artifacts/Nexus.dylib"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 nexus-en/artifacts/Nexus.dylib > nexus-en/artifacts/SHA256SUMS.txt
          file nexus-en/artifacts/Nexus.dylib > nexus-en/artifacts/file.txt
          strings -a nexus-en/artifacts/Nexus.dylib > nexus-en/artifacts/strings.txt || true
          otool -D nexus-en/artifacts/Nexus.dylib > nexus-en/artifacts/install-name.txt
          otool -L nexus-en/artifacts/Nexus.dylib > nexus-en/artifacts/dependencies.txt
          grep -F 'Mach-O 64-bit' nexus-en/artifacts/file.txt
          grep -F 'arm64' nexus-en/artifacts/file.txt
          grep -F '@rpath/Nexus.dylib' nexus-en/artifacts/install-name.txt
          if grep -F '1.1-core-ptbr' nexus-en/artifacts/strings.txt; then exit 1; fi

      - name: Upload Nexus English
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-1.0-English-iQFace-1.1-arm64
          path: nexus-en/artifacts/
          if-no-files-found: error
