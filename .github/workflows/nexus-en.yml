name: Build Nexus 1.0 English

"on":
  workflow_dispatch:
  push:
    paths:
      - "nexus-en/**"
      - ".github/workflows/nexus-en.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: brew install ldid

      - name: Prepare English modules
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nexus-en-build"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          python3 nexus-en/prepare_cache.py iqface-cache-en/Tweak.m "$WORK/CacheTweak.m"
          python3 nexus-en/prepare_icons.py iqface-icons-en/Tweak.m "$WORK/IconsTweak.m"
          cp iqface-icons-en/IconPicker.m "$WORK/IconsPicker.m"
