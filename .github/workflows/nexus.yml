name: Build Nexus 1.0.1 PT-BR

"on":
  workflow_dispatch:
  push:
    paths:
      - "nexus/**"
      - ".github/workflows/nexus.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: brew install ldid

      - name: Build Nexus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 nexus/patch_presentation_v2.py nexus/NexusSettings.m
          cp nexus/prepare_makefile_v2.py nexus/prepare_makefile.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("nexus/build.sh")
          s = p.read_text(encoding="utf-8")
          s = s.replace("grep -F 'Alterar ícone' \"$ARTIFACTS/strings.txt\"\n", "")
          p.write_text(s, encoding="utf-8")
          PY
          bash nexus/build.sh

      - name: Upload Nexus
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-1.0.1-PTBR-iQFace-1.1-arm64
          path: nexus/artifacts/
          if-no-files-found: error
