name: Test iQFaceEnhancer 2.1 PT-BR Lazy

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/iqface-enhancer-2.1-ptbr-lazy-test.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install ldid
        run: brew install ldid

      - name: Reconstruct exact golden source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/iqface-golden"
          PT="$RUNNER_TEMP/iqface-ptbr"
          mkdir -p "$BASE" "$PT"

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/636fea8908d802e4189e61fb292c9f42ad668973" \
            | python3 -c 'import sys,json,base64; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' \
            > "$BASE/Tweak.m"

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/cf0e1fcb8809cf64564bce78d64fb03bbb91a50e" \
            | python3 -c 'import sys,json,base64; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' \
            > "$BASE/WordmarkActivation.m"

          python3 - "$BASE/Tweak.m" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()

          s = s.replace("static void IQFOpenSettings(void) {", "void IQFOpenSettings(void) {", 1)

          pattern = r"static void IQFAttachLongPress\(UIView \*view\) \{.*?\n\}"
          replacement = "static void IQFAttachLongPress(UIView *view) {\n    (void)view;\n    (void)IQFGestureAssociationKey;\n    (void)IQFLongPressDuration;\n}"
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          assert n == 1

          needle = "        if (!IQFSafeModeEnabled()) {\n            IQFInstallNavigationItemHooks();\n            IQFInstallTabBarHooks();\n        }\n"
          guard = "        IQFReplaceMethod(UIView.class, @selector(addSubview:), (IMP)&IQFAddSubview, (IMP *)&IQFOriginalAddSubview);\n\n"
          assert needle in s
          s = s.replace(needle, guard + needle, 1)

          assert 'IQFPresentLauncherMenu' not in s
          open(p, "w", encoding="utf-8").write(s)
          PY

          cat > "$BASE/Makefile" <<'EOF'
          ARCHS = arm64
          TARGET = iphone:clang:latest:14.0
          include $(THEOS)/makefiles/common.mk
          LIBRARY_NAME = iQFaceEnhancer
          iQFaceEnhancer_FILES = Tweak.m WordmarkActivation.m
          iQFaceEnhancer_FRAMEWORKS = Foundation UIKit QuartzCore
          iQFaceEnhancer_CFLAGS = -fobjc-arc -Wall -Wextra
          iQFaceEnhancer_LDFLAGS = -Wl,-install_name,@rpath/iQFaceEnhancer.dylib
          iQFaceEnhancer_INSTALL_PATH = /Library/MobileSubstrate/DynamicLibraries
          include $(THEOS_MAKE_PATH)/library.mk
          EOF

          cp "$BASE/Tweak.m" "$PT/Tweak.m"
          cp "$BASE/WordmarkActivation.m" "$PT/WordmarkActivation.m"
          cp "$BASE/Makefile" "$PT/Makefile"

          # ONLY PT-BR change: install the original IQFLoc hook lazily when settings are opened.
          python3 - "$PT/Tweak.m" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          old = '''    IQFPresentSettingsFunction present = (IQFPresentSettingsFunction)IQFFindSymbol("IQFPresentSettings");
    if (present == NULL) {
        return;
    }

    IQFLastPresentationTime = now;'''
          new = '''    IQFPresentSettingsFunction present = (IQFPresentSettingsFunction)IQFFindSymbol("IQFPresentSettings");
    if (present == NULL) {
        return;
    }

    if (IQFShouldUsePortuguese()) {
        (void)IQFInstallLocalizationHook();
    }

    IQFLastPresentationTime = now;'''
          assert old in s
          s = s.replace(old, new, 1)
          open(p, "w", encoding="utf-8").write(s)
          PY

          diff -u "$BASE/Tweak.m" "$PT/Tweak.m" > "$RUNNER_TEMP/PTBR-SOURCE-DELTA.txt" || true
          cat "$RUNNER_TEMP/PTBR-SOURCE-DELTA.txt"

      - name: Build and verify exact golden baseline
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/iqface-golden"
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          dylib="$(find .theos -type f -name iQFaceEnhancer.dylib -print -quit)"
          test -n "$dylib"
          sha="$(shasum -a 256 "$dylib" | awk '{print $1}')"
          echo "Rebuilt golden SHA256: $sha"
          test "$sha" = "13848d1f813ba6fe13434f87fa2a92c4f039b140acd6d22168ebf74baa43c98d"

      - name: Build PT-BR lazy variant
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/iqface-ptbr"
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          dylib="$(find .theos -type f -name iQFaceEnhancer.dylib -print -quit)"
          test -n "$dylib"
          mkdir -p artifacts
          cp "$dylib" artifacts/iQFaceEnhancer2.1-PTBR-Lazy.dylib
          cp "$RUNNER_TEMP/PTBR-SOURCE-DELTA.txt" artifacts/PTBR-SOURCE-DELTA.txt
          file artifacts/iQFaceEnhancer2.1-PTBR-Lazy.dylib
          shasum -a 256 artifacts/iQFaceEnhancer2.1-PTBR-Lazy.dylib > artifacts/SHA256SUMS.txt
          strings -a artifacts/iQFaceEnhancer2.1-PTBR-Lazy.dylib > artifacts/strings.txt || true
          grep -q "IQFPresentSettings" artifacts/strings.txt
          grep -q "FBNavigationBar" artifacts/strings.txt
          grep -q "iqf_tapped" artifacts/strings.txt
          grep -q "IQFLoc" artifacts/strings.txt
          grep -q "MSHookFunction" artifacts/strings.txt
          ! grep -q "IQFPresentLauncherMenu" artifacts/strings.txt

      - name: Upload PT-BR lazy test
        uses: actions/upload-artifact@v4
        with:
          name: iQFaceEnhancer2.1-PTBR-Lazy
          path: ${{ runner.temp }}/iqface-ptbr/artifacts/
          if-no-files-found: error
