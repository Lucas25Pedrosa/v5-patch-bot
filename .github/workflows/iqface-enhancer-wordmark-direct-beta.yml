name: Build iQFaceEnhancer 2.1 PT-BR 1-to-1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/iqface-enhancer-wordmark-direct-beta.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: |
          brew install ldid

      - name: Prepare exact working beta with original PT-BR localization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/iqface-wordmark-ptbr"
          mkdir -p "$WORK"

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/636fea8908d802e4189e61fb292c9f42ad668973" \
            | python3 -c 'import sys,json,base64; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' \
            > "$WORK/Tweak.m"

          python3 - "$WORK/Tweak.m" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()

          s = s.replace("static void IQFOpenSettings(void) {", "void IQFOpenSettings(void) {", 1)

          pattern = r"static void IQFAttachLongPress\(UIView \*view\) \{.*?\n\}"
          replacement = "static void IQFAttachLongPress(UIView *view) {\n    (void)view;\n    (void)IQFGestureAssociationKey;\n    (void)IQFLongPressDuration;\n}"
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          assert n == 1

          needle = "        if (!IQFSafeModeEnabled()) {\n            IQFInstallNavigationItemHooks();\n            IQFInstallTabBarHooks();\n        }\n"
          assert needle in s
          guard = "        IQFReplaceMethod(UIView.class, @selector(addSubview:), (IMP)&IQFAddSubview, (IMP *)&IQFOriginalAddSubview);\n\n"
          s = s.replace(needle, guard + needle, 1)

          old = "        dispatch_async(dispatch_get_main_queue(), ^{\n            if (!IQFSafeModeEnabled()) {\n                IQFTryInstallIQFaceHooks();\n                IQFCleanVisibleSettingsItems();\n            }\n        });"
          new = "        dispatch_async(dispatch_get_main_queue(), ^{\n            IQFTryInstallIQFaceHooks();\n            if (!IQFSafeModeEnabled()) {\n                IQFCleanVisibleSettingsItems();\n            }\n        });"
          assert old in s
          s = s.replace(old, new, 1)

          assert 'IQFFindSymbol("IQFPresentSettings")' in s
          assert 'IQFPresentLauncherMenu' not in s
          assert '@"Ajustes do iQFace"' in s
          assert 'IQFInstallLocalizationHook()' in s
          open(p, "w", encoding="utf-8").write(s)
          PY

          cp iqface-enhancer-wordmark-beta/WordmarkActivation.m "$WORK/WordmarkActivation.m"

          cat > "$WORK/Makefile" <<'EOF'
          ARCHS = arm64
          TARGET = iphone:clang:latest:14.0

          include $(THEOS)/makefiles/common.mk

          LIBRARY_NAME = iQFaceEnhancer
          iQFaceEnhancer_FILES = Tweak.m WordmarkActivation.m
          iQFaceEnhancer_FRAMEWORKS = Foundation UIKit QuartzCore
          iQFaceEnhancer_CFLAGS = -fobjc-arc -Wall -Wextra
          iQFaceEnhancer_LDFLAGS = -Wl,-install_name,@rpath/iQFaceEnhancer.dylib
          iQFaceEnhancer_INSTALL_PATH = /Library/MobileSubstrate/DynamicLibraries

          include $(THEOS_MAKE_PATH)/library.mk
          EOF

      - name: Build arm64 PT-BR dylib
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/iqface-wordmark-ptbr"
          cd "$WORK"
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          dylib_path="$(find .theos -type f -name iQFaceEnhancer.dylib -print -quit)"
          test -n "$dylib_path"
          mkdir -p artifacts
          cp "$dylib_path" artifacts/iQFaceEnhancer2.1-PTBR.dylib
          file artifacts/iQFaceEnhancer2.1-PTBR.dylib
          shasum -a 256 artifacts/iQFaceEnhancer2.1-PTBR.dylib > artifacts/SHA256SUMS.txt
          strings -a artifacts/iQFaceEnhancer2.1-PTBR.dylib > artifacts/strings.txt || true
          grep -q "IQFPresentSettings" artifacts/strings.txt
          grep -q "FBNavigationBar" artifacts/strings.txt
          grep -q "iqf_tapped" artifacts/strings.txt
          ! grep -q "IQFPresentLauncherMenu" artifacts/strings.txt

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: iQFaceEnhancer2.1-PTBR
          path: ${{ runner.temp }}/iqface-wordmark-ptbr/artifacts/
          if-no-files-found: error
