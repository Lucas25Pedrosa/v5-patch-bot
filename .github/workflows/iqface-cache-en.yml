name: Build iQFace Cache EN

"on":
  workflow_dispatch:
  push:
    paths:
      - "iqface-cache-en/**"
      - ".github/workflows/iqface-cache-en.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: iqface-cache-en

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: |
          brew install ldid

      - name: Build arm64 dylib
        run: |
          set -euo pipefail
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          mkdir -p artifacts
          dylib_path="$(find .theos -type f -name iQFaceCache.dylib -print -quit)"
          test -n "$dylib_path"
          cp "$dylib_path" artifacts/iQFaceCache.dylib
          shasum -a 256 artifacts/iQFaceCache.dylib > artifacts/SHA256SUMS.txt
          file artifacts/iQFaceCache.dylib
          strings -a artifacts/iQFaceCache.dylib | grep -F "Clear cache"
          grep -F '@"✓ Cache cleared"' Tweak.m
          grep -F 'Approximately %@ of temporary files will be removed.' Tweak.m
          grep -F '@"Cancel"' Tweak.m
          grep -F '@"Clear"' Tweak.m
          grep -F '@"%@ freed"' Tweak.m
          if strings -a artifacts/iQFaceCache.dylib | grep -F "UILongPressGestureRecognizer"; then
            echo "Unexpected gesture recognizer in English iQFaceCache"
            exit 1
          fi

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: iQFaceCache-en-0.1.0-arm64
          path: iqface-cache-en/artifacts/
          if-no-files-found: error
