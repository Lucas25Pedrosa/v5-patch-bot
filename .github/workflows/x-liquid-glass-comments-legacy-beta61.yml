name: Build XLiquidGlass Beta 6.1 Comments Legacy Safe

on:
  push:
    paths:
      - 'x-liquid-glass-only/**'
      - 'scripts/patch_xlg_comments_legacy_beta61.py'
      - '.github/workflows/x-liquid-glass-comments-legacy-beta61.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Beta 6.1 safe comments legacy patch
        run: python3 scripts/patch_xlg_comments_legacy_beta61.py

      - name: Verify Beta 6.1 markers
        run: |
          grep -n 'XLGCommentsLegacyBeta61Init' x-liquid-glass-only/XLiquidGlass.m
          grep -n 'gXLGCommentsLegacyScopeDepth' x-liquid-glass-only/XLiquidGlass.m
          grep -n 'T1ConversationContainerViewController' x-liquid-glass-only/XLiquidGlass.m
          grep -n 'T1URTViewController' x-liquid-glass-only/XLiquidGlass.m
          if grep -n 'gXLGCommentsSavedPersistedGate' x-liquid-glass-only/XLiquidGlass.m; then exit 1; fi
          if grep -n 'XLGCommentsLegacySetNativeGate' x-liquid-glass-only/XLiquidGlass.m; then exit 1; fi

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install signing tool
        run: brew install ldid

      - name: Build XLiquidGlass Beta 6.1
        working-directory: x-liquid-glass-only
        run: |
          make clean
          make FINALPACKAGE=1
          mkdir -p ../build-xlg-comments-legacy-beta61
          cp .theos/obj/debug/XLiquidGlass.dylib ../build-xlg-comments-legacy-beta61/XLiquidGlass-2.0.2-Beta6.1-CommentsLegacySafe-arm64.dylib || \
          cp .theos/obj/XLiquidGlass.dylib ../build-xlg-comments-legacy-beta61/XLiquidGlass-2.0.2-Beta6.1-CommentsLegacySafe-arm64.dylib
          file ../build-xlg-comments-legacy-beta61/XLiquidGlass-2.0.2-Beta6.1-CommentsLegacySafe-arm64.dylib
          shasum -a 256 ../build-xlg-comments-legacy-beta61/XLiquidGlass-2.0.2-Beta6.1-CommentsLegacySafe-arm64.dylib > ../build-xlg-comments-legacy-beta61/XLiquidGlass-2.0.2-Beta6.1-CommentsLegacySafe-SHA256SUMS.txt

      - name: Upload XLiquidGlass Beta 6.1
        uses: actions/upload-artifact@v4
        with:
          name: XLiquidGlass-2.0.2-Beta6.1-CommentsLegacySafe-arm64
          path: build-xlg-comments-legacy-beta61/*
          if-no-files-found: error
