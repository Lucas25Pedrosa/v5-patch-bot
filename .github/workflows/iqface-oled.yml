name: Build iQFace OLED

"on":
  workflow_dispatch:
  push:
    paths:
      - "iqface-oled/**"
      - ".github/workflows/iqface-oled.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: iqface-oled

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: |
          brew install ldid

      - name: Prepare iQFaceOLED 0.2.0 from validated 0.1.7
        run: |
          set -euo pipefail
          python3 prepare_oled.py
          python3 prepare_separator.py
          python3 finalize_020.py

      - name: Validate separator scope
        run: |
          set -euo pipefail
          grep -F '// iQFaceOLED 0.2.0' Tweak.m
          grep -F 'FBLineComponentInternalView' Tweak.m
          grep -F 'iQFaceOLEDFeedSeparatorsEnabled' Tweak.m
          grep -F '@"Separadores no feed"' Tweak.m
          grep -F 'return UIColor.whiteColor;' Tweak.m
          grep -F 'IQFOLEDUpdateFeedSeparator' Tweak.m
          if grep -E 'MSHook|method_exchangeImplementations|method_setImplementation|class_replaceMethod|class_addMethod|rebind_symbols' prepare_separator.py finalize_020.py; then
            echo "Unexpected new hook/interception mechanism in separator preparation"
            exit 1
          fi

      - name: Build and validate arm64 dylib
        run: |
          set -euo pipefail
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          mkdir -p artifacts

          dylib_path=""
          while IFS= read -r candidate; do
            if file "$candidate" | grep -q "dynamically linked shared library"; then
              dylib_path="$candidate"
              break
            fi
          done < <(find .theos -name iQFaceOLED.dylib -print)

          test -n "$dylib_path"
          cp "$dylib_path" artifacts/iQFaceOLED.dylib
          shasum -a 256 artifacts/iQFaceOLED.dylib > artifacts/SHA256SUMS.txt

          file_info="$(file artifacts/iQFaceOLED.dylib)"
          echo "$file_info"
          echo "$file_info" | grep -F "Mach-O 64-bit"
          echo "$file_info" | grep -F "arm64"
          echo "$file_info" | grep -F "dynamically linked shared library"

          # Existing OLED control and avatar fix must remain intact.
          grep -F 'rowWithTitle:icon:key:def:onChange:' Tweak.m
          grep -F 'IQFOLEDPreferenceKey' Tweak.m
          grep -F 'IQFOLEDSetEnabled(!gIQFOLEDEnabled, nil);' Tweak.m
          grep -F 'iQFaceOLEDEnabled' Tweak.m
          grep -F 'IQFOLEDIsUnmaskedAvatarVariant' Tweak.m
          grep -F 'IQFOLEDUpdateAvatarClip' Tweak.m
          grep -F '_FBMaskedRoundedCornerView' Tweak.m
          grep -F 'MRCImageComponentView' Tweak.m
          grep -F 'MRCAnimatedImageView' Tweak.m

          # OLED row remains after Change Icon; separator row follows OLED.
          grep -F 'Keep OLED visually separate from the two cache controls' Tweak.m
          grep -F 'IQFOLEDCreateSeparatorRow' Tweak.m
          grep -F 'oledIndex + 1' Tweak.m

          strings -a artifacts/iQFaceOLED.dylib | grep -F "FBNewsFeedView"
          strings -a artifacts/iQFaceOLED.dylib | grep -F "Modo OLED"
          strings -a artifacts/iQFaceOLED.dylib | grep -F "Separadores no feed"
          strings -a artifacts/iQFaceOLED.dylib | grep -F "iQFaceOLEDFeedSeparatorsEnabled"
          strings -a artifacts/iQFaceOLED.dylib | grep -F "FBLineComponentInternalView"
          strings -a artifacts/iQFaceOLED.dylib | grep -F "FBPassthroughView"
          strings -a artifacts/iQFaceOLED.dylib | grep -F "_FBMaskedRoundedCornerView"

          if strings -a artifacts/iQFaceOLED.dylib | grep -F "IQFOLEDModePickerController"; then
            echo "Unexpected legacy OLED picker in iQFaceOLED 0.2.0"
            exit 1
          fi
          if strings -a artifacts/iQFaceOLED.dylib | grep -F "valueRowWithTitle:icon:detail:tap:"; then
            echo "Unexpected legacy value row in iQFaceOLED 0.2.0"
            exit 1
          fi
          if strings -a artifacts/iQFaceOLED.dylib | grep -F "UILongPressGestureRecognizer"; then
            echo "Unexpected gesture recognizer in iQFaceOLED"
            exit 1
          fi

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: iQFaceOLED-0.2.0-feed-separator-arm64
          path: iqface-oled/artifacts/
          if-no-files-found: error
