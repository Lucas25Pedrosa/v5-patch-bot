name: Build Facebook Wordmark Tap Beta

"on":
  workflow_dispatch:
  push:
    paths:
      - "facebook-wordmark-tap-beta/**"
      - ".github/workflows/facebook-wordmark-tap-beta.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: facebook-wordmark-tap-beta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: |
          brew install ldid

      - name: Build arm64 dylib
        run: |
          set -euo pipefail
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          mkdir -p artifacts
          dylib_path="$(find .theos -type f -name FacebookWordmarkTapBeta.dylib -print -quit)"
          test -n "$dylib_path"
          cp "$dylib_path" artifacts/FacebookWordmarkTapBeta.dylib
          file artifacts/FacebookWordmarkTapBeta.dylib
          shasum -a 256 artifacts/FacebookWordmarkTapBeta.dylib > artifacts/SHA256SUMS.txt

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FacebookWordmarkTapBeta-arm64
          path: facebook-wordmark-tap-beta/artifacts/
          if-no-files-found: error
