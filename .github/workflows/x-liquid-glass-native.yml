name: Build XLiquidGlassNative

# XLiquidGlassNative 3.1 Beta 7 Distribution Edition:
# 3.0 native activation + localized NFB Appearance submenu + isolated credits
# + Beta 2 icon resolver + validated 2.0.2 Portal/Carried active-tab tint model.
"on":
  workflow_dispatch:
  push:
    paths:
      - "x-liquid-glass-native/**"
      - ".github/workflows/x-liquid-glass-native.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: x-liquid-glass-native

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: brew install ldid

      - name: Build XLiquidGlassNative dylib
        run: |
          set -euo pipefail
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          mkdir -p artifacts
          dylib_path="$(find .theos -type f -name XLiquidGlassNative.dylib ! -path '*/XLiquidGlassNative.dylib.dSYM/*' -print -quit)"
          test -n "$dylib_path"
          cp "$dylib_path" artifacts/XLiquidGlassNative.dylib
          file artifacts/XLiquidGlassNative.dylib
          shasum -a 256 artifacts/XLiquidGlassNative.dylib > artifacts/SHA256SUMS.txt

      - name: Upload XLiquidGlassNative dylib
        uses: actions/upload-artifact@v4
        with:
          name: XLiquidGlassNative-3.1-Beta7-Distribution-Edition-arm64
          path: x-liquid-glass-native/artifacts/
          if-no-files-found: error
