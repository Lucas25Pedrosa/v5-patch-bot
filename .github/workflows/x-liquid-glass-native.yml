name: Build XLiquidGlassNative

on:
  workflow_dispatch:
  push:
    paths:
      - 'x-liquid-glass-native/**'
      - '.github/workflows/x-liquid-glass-native.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y git make perl clang lld libplist-utils
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install signing tool
        run: |
          sudo apt-get install -y ldid

      - name: Build XLiquidGlassNative dylib
        run: |
          set -e
          cd x-liquid-glass-native
          make clean
          make FINALPACKAGE=1
          DYLIB=$(find .theos -type f -name 'XLiquidGlassNative.dylib' | head -n 1)
          test -n "$DYLIB"
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          cp "$DYLIB" "$GITHUB_WORKSPACE/artifact/XLiquidGlassNative.dylib"
          sha256sum "$GITHUB_WORKSPACE/artifact/XLiquidGlassNative.dylib" | tee "$GITHUB_WORKSPACE/artifact/SHA256SUMS.txt"
          file "$GITHUB_WORKSPACE/artifact/XLiquidGlassNative.dylib"

      - name: Upload XLiquidGlassNative dylib
        uses: actions/upload-artifact@v4
        with:
          name: XLiquidGlassNative-3.1-Beta6-Distribution-Edition-arm64
          path: artifact/*
          if-no-files-found: error
