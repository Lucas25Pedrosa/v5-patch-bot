name: Build XLiquidGlass Beta1 Cache Test

# XLiquidGlass 3.0 Beta 1 for X 12.38.
# Cache-isolation build: same code, different tweak/dylib identity.
"on":
  workflow_dispatch:
  push:
    paths:
      - "x-liquid-glass-native/**"
      - ".github/workflows/x-liquid-glass-native.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: x-liquid-glass-native

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: brew install ldid

      - name: Build renamed XLiquidGlass dylib
        run: |
          set -euo pipefail
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          mkdir -p artifacts
          dylib_path="$(find .theos -type f -name XLiquidGlassB1X1238.dylib ! -path '*/XLiquidGlassB1X1238.dylib.dSYM/*' -print -quit)"
          test -n "$dylib_path"
          cp "$dylib_path" artifacts/XLiquidGlassB1X1238.dylib
          file artifacts/XLiquidGlassB1X1238.dylib
          shasum -a 256 artifacts/XLiquidGlassB1X1238.dylib > artifacts/SHA256SUMS.txt

      - name: Upload renamed XLiquidGlass dylib
        uses: actions/upload-artifact@v4
        with:
          name: XLiquidGlass-3.0-Beta1-X12.38-CACHE-TEST-arm64
          path: x-liquid-glass-native/artifacts/
          if-no-files-found: error
