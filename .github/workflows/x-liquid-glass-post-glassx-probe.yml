name: Build GlassX Post-Activation Probe

"on":
  workflow_dispatch:
  push:
    branches:
      - x-liquid-glass-feature-consumption-probe-20261027
    paths:
      - "x-liquid-glass-post-glassx-probe/**"
      - ".github/workflows/x-liquid-glass-post-glassx-probe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ldid
        run: brew install ldid

      - name: Build read-only post-activation probe
        working-directory: x-liquid-glass-post-glassx-probe
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -fobjc-arc \
            -fblocks \
            -framework Foundation \
            -framework UIKit \
            -Wl,-undefined,dynamic_lookup \
            GlassXPostActivationProbe.m \
            -o GlassXPostActivationProbe.dylib

          install_name_tool -id /Library/MobileSubstrate/DynamicLibraries/GlassXPostActivationProbe.dylib GlassXPostActivationProbe.dylib
          ldid -S GlassXPostActivationProbe.dylib

          mkdir -p artifacts
          cp GlassXPostActivationProbe.dylib artifacts/
          file artifacts/GlassXPostActivationProbe.dylib
          otool -D artifacts/GlassXPostActivationProbe.dylib | tee artifacts/LC_ID_DYLIB.txt
          test "$(tail -n 1 artifacts/LC_ID_DYLIB.txt)" = "/Library/MobileSubstrate/DynamicLibraries/GlassXPostActivationProbe.dylib"

          strings artifacts/GlassXPostActivationProbe.dylib | grep -F "FEATURE_CONSUMPTION"
          strings artifacts/GlassXPostActivationProbe.dylib | grep -F "isPushChromeSnapEnabled"
          strings artifacts/GlassXPostActivationProbe.dylib | grep -F "isAvatarBadgeEnabledWithFeatureSwitches:"
          strings artifacts/GlassXPostActivationProbe.dylib | grep -F "isQuickComposerEnabledWithFeatureSwitches:"
          strings artifacts/GlassXPostActivationProbe.dylib | grep -F "declaresGlassComposer"
          strings artifacts/GlassXPostActivationProbe.dylib | grep -F "CONSUMED selector="

          shasum -a 256 artifacts/GlassXPostActivationProbe.dylib > artifacts/SHA256SUMS.txt
          cat > artifacts/BUILD_INFO.txt <<'EOF'
          Name: GlassXFeatureConsumptionProbe
          Version: 2.0
          Target: X 12.38 build 24 + GlassX 3.1 Beta 1
          Mode: read-only runtime consumption tracer
          Writes flags: no
          Forces gates: no
          Log: Documents/GlassXFeatureConsumptionProbe.log
          EOF

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: GlassXFeatureConsumptionProbe-2.0-X12.38-build24-arm64
          path: x-liquid-glass-post-glassx-probe/artifacts/
          if-no-files-found: error
