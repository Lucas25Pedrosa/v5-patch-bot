name: Build FBOLED Safe Diagnostic

"on":
  workflow_dispatch:
  push:
    paths:
      - "fboled-diagnostic/**"
      - ".github/workflows/fboled-diagnostic.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: fboled-diagnostic

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: |
          brew install ldid

      - name: Build safe diagnostic dylib
        run: |
          set -euo pipefail
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          mkdir -p artifacts
          dylib_path="$(find .theos -type f -name FBOLEDSafeDiagnostic.dylib -print -quit)"
          test -n "$dylib_path"
          cp "$dylib_path" artifacts/FBOLEDSafeDiagnostic.dylib
          file artifacts/FBOLEDSafeDiagnostic.dylib
          shasum -a 256 artifacts/FBOLEDSafeDiagnostic.dylib > artifacts/SHA256SUMS.txt

      - name: Upload safe diagnostic dylib
        uses: actions/upload-artifact@v4
        with:
          name: FBOLEDSafeDiagnostic-0.2.0-arm64
          path: fboled-diagnostic/artifacts/
          if-no-files-found: error
