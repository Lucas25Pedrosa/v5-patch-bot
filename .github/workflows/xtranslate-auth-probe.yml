name: Build Grok Session Diff Probe

"on":
  workflow_dispatch:
  push:
    branches:
      - "xtranslate-auth-probe-*"
      - "xtranslate-grok-probe-*"
      - "xtranslate-grok-bootstrap-probe-*"
      - "xtranslate-tap-diff-probe-*"
      - "xtranslate-grok-endpoint-fix-*"
      - "xtranslate-grok-bootstrap-fix-*"
    paths:
      - "xtranslate-auth-probe/**"
      - ".github/workflows/xtranslate-auth-probe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: xtranslate-auth-probe

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
      - name: Install signing tool
        run: brew install ldid
      - name: Build and validate
        run: |
          set -euo pipefail
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          mkdir -p artifacts
          dylib_path="$(find .theos -type f -name XTranslateAuthProbe.dylib ! -path '*/XTranslateAuthProbe.dylib.dSYM/*' -print -quit)"
          test -n "$dylib_path"
          cp "$dylib_path" artifacts/XTranslateGrokSessionDiffProbe-0.10.0-Beta1-X12.31.1-arm64.dylib
          file artifacts/XTranslateGrokSessionDiffProbe-0.10.0-Beta1-X12.31.1-arm64.dylib
          lipo -info artifacts/XTranslateGrokSessionDiffProbe-0.10.0-Beta1-X12.31.1-arm64.dylib
          shasum -a 256 artifacts/XTranslateGrokSessionDiffProbe-0.10.0-Beta1-X12.31.1-arm64.dylib > artifacts/SHA256SUMS.txt
      - name: Publish branch build
        run: |
          set -euo pipefail
          mkdir -p ../xtranslate-builds/0.10-beta1
          cp artifacts/XTranslateGrokSessionDiffProbe-0.10.0-Beta1-X12.31.1-arm64.dylib ../xtranslate-builds/0.10-beta1/
          cp artifacts/SHA256SUMS.txt ../xtranslate-builds/0.10-beta1/
          (cd artifacts && zip -j XTranslateGrokSessionDiffProbe-0.10.0-Beta1-X12.31.1-arm64.zip XTranslateGrokSessionDiffProbe-0.10.0-Beta1-X12.31.1-arm64.dylib SHA256SUMS.txt)
          cp artifacts/XTranslateGrokSessionDiffProbe-0.10.0-Beta1-X12.31.1-arm64.zip ../xtranslate-builds/0.10-beta1/
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xtranslate-builds/0.10-beta1
          git commit -m "build: publish Grok session diff 0.10 beta 1" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XTranslateGrokSessionDiffProbe-0.10.0-Beta1-X12.31.1-arm64
          path: xtranslate-auth-probe/artifacts/
          if-no-files-found: error
