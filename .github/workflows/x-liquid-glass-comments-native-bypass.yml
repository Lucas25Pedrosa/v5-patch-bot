name: Build XLiquidGlass 2.0.2 Beta 4 Comments Effect Bypass

on:
  push:
    paths:
      - 'scripts/patch_xlg_comments_effect_bypass.py'
      - '.github/workflows/x-liquid-glass-comments-native-bypass.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4

      - name: Checkout XLiquidGlass 2.0.2 stable source
        uses: actions/checkout@v4
        with:
          ref: xlg-2.0.2-stable-x12.31-20261002
          path: upstream

      - name: Patch comments setEffect guard
        run: |
          python3 scripts/patch_xlg_comments_effect_bypass.py upstream/x-liquid-glass-only/XLiquidGlass.m
          grep -n -A28 -B6 'XLGCommentsNativeEffectContext' upstream/x-liquid-glass-only/XLiquidGlass.m

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install signing tool
        run: brew install ldid

      - name: Build patched XLiquidGlass
        working-directory: upstream/x-liquid-glass-only
        run: |
          make clean
          make FINALPACKAGE=1
          mkdir -p ../../build-xlg-comments-effect-bypass
          cp .theos/obj/debug/XLiquidGlass.dylib ../../build-xlg-comments-effect-bypass/XLiquidGlass-2.0.2-Beta4-CommentsEffectBypass-arm64.dylib || \
          cp .theos/obj/XLiquidGlass.dylib ../../build-xlg-comments-effect-bypass/XLiquidGlass-2.0.2-Beta4-CommentsEffectBypass-arm64.dylib
          file ../../build-xlg-comments-effect-bypass/XLiquidGlass-2.0.2-Beta4-CommentsEffectBypass-arm64.dylib
          shasum -a 256 ../../build-xlg-comments-effect-bypass/XLiquidGlass-2.0.2-Beta4-CommentsEffectBypass-arm64.dylib > ../../build-xlg-comments-effect-bypass/XLiquidGlass-2.0.2-Beta4-CommentsEffectBypass-SHA256SUMS.txt

      - name: Upload patched XLiquidGlass
        uses: actions/upload-artifact@v4
        with:
          name: XLiquidGlass-2.0.2-Beta4-CommentsEffectBypass-arm64
          path: build-xlg-comments-effect-bypass/*
          if-no-files-found: error
