name: Build Nexus 2.1.1 IPA Vault

"on":
  workflow_dispatch:
  push:
    paths:
      - "nexus2/**"
      - "nexus21/**"
      - "nexus/prepare_cache.py"
      - "nexus/prepare_icons.py"
      - "iqface-cache/**"
      - "iqface-icons/**"
      - "iqface-4in1/Makefile"
      - ".github/workflows/nexus-2.1.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: brew install ldid

      - name: Prepare Nexus 2.1.1 from frozen Run52 OLED
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          WORK="$RUNNER_TEMP/nexus-2.1.1"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          test "$(git hash-object nexus21/run52-oled/Tweak.m)" = "e2463ca226fd5f6791eef1dca8e9451d8a7de10c"
          test "$(git hash-object nexus21/run52-oled/prepare_oled.py)" = "521e065b9241d381303fb5ec808cde8575558b4c"
          test "$(git hash-object nexus21/run52-oled/prepare_separator.py)" = "f516743884cbb80f930c0bdafa3e52d3e6a6f391"
          test "$(git hash-object nexus21/run52-oled/finalize_020.py)" = "eaaef107ce0db74d2166cd2a4d4d0b5d3d14bd1e"
          test "$(git hash-object nexus21/run52-oled/adapt_iqface11.py)" = "ea91d224fdda55b88c0981a1a2515659fe6754da"
          test "$(git hash-object nexus21/run52-oled/adapt_iqface11_native_icon_switches.py)" = "d0361fd4f5ea3c0780ec002a1628397cd4aafdcd"
          test "$(git hash-object nexus21/run52-oled/nexus_prepare_oled.py)" = "df4ea6830606844849bafde6efae28c1b62be618"
          test "$(git hash-object nexus21/run52-oled/NexusAvatarFix.m)" = "639d0c98b397df623aebfe194ad908aaf24f9066"

          python3 nexus/prepare_cache.py iqface-cache/Tweak.m "$WORK/CacheTweak.m"
          python3 nexus2/patch_cache_v2.py "$WORK/CacheTweak.m"

          python3 nexus/prepare_icons.py iqface-icons/Tweak.m "$WORK/IconsTweak.m"
          cp iqface-icons/IconPicker.m "$WORK/IconsPicker.m"
          python3 nexus2/patch_icon_picker_v2.py "$WORK/IconsPicker.m"

          cp nexus21/run52-oled/Tweak.m "$WORK/Tweak.m"
          (
            cd "$WORK"
            python3 "$ROOT/nexus21/run52-oled/prepare_oled.py"
            python3 "$ROOT/nexus21/run52-oled/prepare_separator.py"
            python3 "$ROOT/nexus21/run52-oled/finalize_020.py"
            python3 "$ROOT/nexus21/run52-oled/adapt_iqface11.py"
            python3 "$ROOT/nexus21/run52-oled/adapt_iqface11_native_icon_switches.py"
          )
          python3 nexus21/run52-oled/nexus_prepare_oled.py "$WORK/Tweak.m" "$WORK/OLEDTweak.m"
          rm "$WORK/Tweak.m"

          cp nexus2/Nexus2.m "$WORK/Nexus2.m"
          cp nexus21/NexusIPAVaultCredit.m "$WORK/NexusIPAVaultCredit.m"
          python3 nexus2/prepare_makefile.py iqface-4in1/Makefile "$WORK/Makefile"
          cp nexus21/run52-oled/NexusAvatarFix.m "$WORK/NexusAvatarFix.m"

          python3 - "$WORK/Nexus2.m" "$WORK/Makefile" <<'PY'
          from pathlib import Path
          import sys

          nexus = Path(sys.argv[1])
          text = nexus.read_text(encoding="utf-8")

          replacements = [
              ('NexusVersion = @"2.1"', 'NexusVersion = @"2.1.1"'),
              ('@"nexusVersion": @"2.1"', '@"nexusVersion": @"2.1.1"'),
              ('setValue:@"v2.1" forKey:@"valueText"', 'setValue:@"v2.1.1" forKey:@"valueText"'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"missing version marker: {old}")
              text = text.replace(old, new, 1)

          if text.count('Nexus 2.1') < 2:
              raise SystemExit('expected Nexus 2.1 display/log markers')
          text = text.replace('Nexus 2.1', 'Nexus 2.1.1')
          nexus.write_text(text, encoding="utf-8")

          makefile = Path(sys.argv[2])
          make = makefile.read_text(encoding="utf-8")
          marker = 'Nexus2.m NexusAvatarFix.m'
          if marker not in make:
              raise SystemExit('Nexus Makefile source marker not found')
          make = make.replace(marker, marker + ' NexusIPAVaultCredit.m', 1)
          makefile.write_text(make, encoding="utf-8")
          PY

          ! grep -F 'Translation.m' "$WORK/Makefile"
          ! grep -F 'EnhancerTweak.m' "$WORK/Makefile"
          ! grep -F 'WordmarkActivation.m' "$WORK/Makefile"
          grep -F 'NexusIPAVaultCredit.m' "$WORK/Makefile"

          grep -F 'NexusVersion = @"2.1.1"' "$WORK/Nexus2.m"
          grep -F 'NXKeyOLED = @"iQFaceOLEDEnabled"' "$WORK/Nexus2.m"
          grep -F 'iQFaceOLEDFeedSeparatorsEnabled' "$WORK/Nexus2.m"
          ! grep -F 'NexusCustomBackgroundColor' "$WORK/Nexus2.m"
          ! grep -F 'UIColorPickerViewController' "$WORK/Nexus2.m"
          ! grep -F 'Custom color' "$WORK/Nexus2.m"

          grep -F 'IPA Vault' "$WORK/NexusIPAVaultCredit.m"
          grep -F 'IPA Source • Nexus Distributor' "$WORK/NexusIPAVaultCredit.m"
          grep -F 'https://t.me/ipavault' "$WORK/NexusIPAVaultCredit.m"
          grep -F 'shippingbox.circle' "$WORK/NexusIPAVaultCredit.m"

          grep -F 'IQFOLEDPreferenceKey = @"iQFaceOLEDEnabled"' "$WORK/OLEDTweak.m"
          grep -F 'IQFOLEDSeparatorsPreferenceKey = @"iQFaceOLEDFeedSeparatorsEnabled"' "$WORK/OLEDTweak.m"
          grep -F 'IQFOLEDIsMappedDark' "$WORK/OLEDTweak.m"
          grep -F 'FBLineComponentInternalView' "$WORK/OLEDTweak.m"
          grep -F 'NexusOLEDCreateModeSetting' "$WORK/OLEDTweak.m"
          grep -F 'NexusOLEDCreateSeparatorSetting' "$WORK/OLEDTweak.m"
          grep -F 'gIQFOLEDEnabled && gIQFOLEDDarkMode' "$WORK/OLEDTweak.m"
          ! grep -F 'Nexus2Background' "$WORK/OLEDTweak.m"
          ! grep -F 'NexusCustomBackgroundColor' "$WORK/OLEDTweak.m"

      - name: Build Nexus 2.1.1
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          WORK="$RUNNER_TEMP/nexus-2.1.1"
          cd "$WORK"
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"

          OUT="$ROOT/nexus21/artifacts"
          mkdir -p "$OUT"
          rm -f "$OUT"/*
          DYLIB_PATH="$(find .theos -type f -name Nexus.dylib -print -quit)"
          test -n "$DYLIB_PATH"
          cp "$DYLIB_PATH" "$OUT/Nexus.dylib"

          cd "$ROOT"
          shasum -a 256 nexus21/artifacts/Nexus.dylib > nexus21/artifacts/SHA256SUMS.txt
          file nexus21/artifacts/Nexus.dylib > nexus21/artifacts/file.txt
          strings -a nexus21/artifacts/Nexus.dylib > nexus21/artifacts/strings.txt || true
          otool -D nexus21/artifacts/Nexus.dylib > nexus21/artifacts/install-name.txt
          nm -gU nexus21/artifacts/Nexus.dylib > nexus21/artifacts/symbols.txt || true

          grep -F 'Mach-O 64-bit' nexus21/artifacts/file.txt
          grep -F 'arm64' nexus21/artifacts/file.txt
          grep -F '@rpath/Nexus.dylib' nexus21/artifacts/install-name.txt
          grep -F 'Nexus 2.1.1 loaded' nexus21/artifacts/strings.txt
          grep -F 'v2.1.1' nexus21/artifacts/strings.txt
          grep -F 'iQFaceOLEDEnabled' nexus21/artifacts/strings.txt
          grep -F 'iQFaceOLEDFeedSeparatorsEnabled' nexus21/artifacts/strings.txt
          grep -F 'Modo OLED' nexus21/artifacts/strings.txt
          grep -F 'Separadores no feed' nexus21/artifacts/strings.txt
          grep -F 'FBLineComponentInternalView' nexus21/artifacts/strings.txt
          grep -F 'NexusHideThreadsPromotions' nexus21/artifacts/strings.txt
          grep -F 'NexusHideSuggestedPages' nexus21/artifacts/strings.txt
          grep -F 'NexusHideStoryPeopleSuggestions' nexus21/artifacts/strings.txt
          grep -F 'NexusActivationMode' nexus21/artifacts/strings.txt
          grep -F 'IPA Vault' nexus21/artifacts/strings.txt
          grep -F 'https://t.me/ipavault' nexus21/artifacts/strings.txt
          grep -F 'shippingbox.circle' nexus21/artifacts/strings.txt

          python3 - <<'PY'
          from pathlib import Path
          data = Path('nexus21/artifacts/Nexus.dylib').read_bytes()
          text = 'IPA Source • Nexus Distributor'
          variants = [text.encode('utf-8'), text.encode('utf-16le'), text.encode('utf-16be')]
          if not any(v in data for v in variants):
              raise SystemExit('Missing IPA Vault subtitle in Nexus.dylib')
          print('FOUND IPA Vault subtitle')
          PY

          ! grep -F 'NexusCustomBackgroundColor' nexus21/artifacts/strings.txt
          ! grep -F 'Custom color' nexus21/artifacts/strings.txt
          ! grep -F 'Nexus2BackgroundModeKey' nexus21/artifacts/strings.txt

      - name: Upload Nexus 2.1.1
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-2.1.1-IPAVault-arm64
          path: nexus21/artifacts/
          if-no-files-found: error
          retention-days: 90
