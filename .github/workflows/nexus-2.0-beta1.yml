name: Build Nexus 2.0 Beta 2 R3

"on":
  workflow_dispatch:
  push:
    paths:
      - "nexus2/**"
      - "nexus/NexusAvatarFix.m"
      - "nexus/prepare_cache.py"
      - "nexus/prepare_icons.py"
      - "nexus/prepare_oled.py"
      - "iqface-cache/**"
      - "iqface-icons/**"
      - "iqface-oled/**"
      - "iqface-4in1/Makefile"
      - ".github/workflows/nexus-2.0-beta1.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: brew install ldid

      - name: Prepare Nexus 2.0 Beta 2 R3
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          WORK="$RUNNER_TEMP/nexus-2.0-beta1"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          python3 nexus/prepare_cache.py iqface-cache/Tweak.m "$WORK/CacheTweak.m"
          python3 nexus2/patch_cache_v2.py "$WORK/CacheTweak.m"

          python3 nexus/prepare_icons.py iqface-icons/Tweak.m "$WORK/IconsTweak.m"
          cp iqface-icons/IconPicker.m "$WORK/IconsPicker.m"
          python3 nexus2/patch_icon_picker_v2.py "$WORK/IconsPicker.m"

          cp iqface-oled/Tweak.m "$WORK/Tweak.m"
          (
            cd "$WORK"
            python3 "$ROOT/iqface-oled/prepare_oled.py"
            python3 "$ROOT/iqface-oled/prepare_separator.py"
            python3 "$ROOT/iqface-oled/finalize_020.py"
            python3 "$ROOT/iqface-oled/adapt_iqface11.py"
            python3 "$ROOT/iqface-oled/adapt_iqface11_native_icon_switches.py"
          )
          python3 nexus/prepare_oled.py "$WORK/Tweak.m" "$WORK/OLEDTweak.m"
          python3 nexus2/prepare_oled_v2.py "$WORK/OLEDTweak.m"
          rm "$WORK/Tweak.m"

          cp nexus2/Nexus2.m "$WORK/Nexus2.m"
          python3 nexus2/prepare_makefile.py iqface-4in1/Makefile "$WORK/Makefile"
          python3 nexus2/patch_avatar_v2.py "$WORK/NexusAvatarFix.m"

          ! grep -F 'Translation.m' "$WORK/Makefile"
          ! grep -F 'EnhancerTweak.m' "$WORK/Makefile"
          ! grep -F 'WordmarkActivation.m' "$WORK/Makefile"
          grep -F 'Nexus2.m' "$WORK/Makefile"
          grep -F 'NexusVersion = @"2.0 Beta 2 R3"' "$WORK/Nexus2.m"
          grep -F 'NexusHideThreadsPromotions' "$WORK/Nexus2.m"
          grep -F 'NexusHideSuggestedPages' "$WORK/Nexus2.m"
          grep -F 'NexusHideStoryPeopleSuggestions' "$WORK/Nexus2.m"
          grep -F 'FBNavigationBar' "$WORK/Nexus2.m"
          grep -F 'IQFResolvedLanguage' "$WORK/Nexus2.m"
          grep -F 'Nexus2TargetBackgroundColor' "$WORK/OLEDTweak.m"
          grep -F 'Nexus2BackgroundHookInstalled' "$WORK/OLEDTweak.m"
          grep -F 'Nexus2BackgroundEffectActive' "$WORK/OLEDTweak.m"
          grep -F 'gIQFOLEDModeKnown && gIQFOLEDDarkMode' "$WORK/OLEDTweak.m"
          ! grep -F 'window.traitCollection.userInterfaceStyle == UIUserInterfaceStyleDark' "$WORK/OLEDTweak.m"
          grep -F 'Nexus2BackgroundEffectActive' "$WORK/NexusAvatarFix.m"
          grep -F 'Nexus2AvatarHooksInstalled' "$WORK/NexusAvatarFix.m"
          grep -F '_IQFKey' "$WORK/Nexus2.m"
          grep -F 'feedUnitType' "$WORK/Nexus2.m"
          grep -F 'feed_unit_type' "$WORK/Nexus2.m"
          grep -F 'inlineUnitType' "$WORK/Nexus2.m"
          grep -F 'NXWordmarkRecognizerAttached' "$WORK/Nexus2.m"
          grep -F 'Nexus developer' "$WORK/Nexus2.m"
          grep -F 'IQFTweakSettings' "$WORK/Nexus2.m"
          grep -F 'NXObjectUnaryMethodCompatible' "$WORK/Nexus2.m"
          grep -F 'Restoring saved Facebook logo activation immediately' "$WORK/Nexus2.m"
          grep -F 'Waiting for feed detection' "$WORK/Nexus2.m"
          grep -F 'Technical log' "$WORK/Nexus2.m"
          grep -F 'NXColoredIcon' "$WORK/Nexus2.m"
          grep -F 'NXCreateVersionSetting' "$WORK/Nexus2.m"
          grep -F 'NXCreateDeveloperCredit' "$WORK/Nexus2.m"
          grep -F 'NXEnsureFeedDetectionTimer' "$WORK/Nexus2.m"
          grep -F 'Nexus2UtilitiesController' "$WORK/Nexus2.m"
          grep -F 'Nexus2ToolsController' "$WORK/Nexus2.m"
          grep -F 'Activation method' "$WORK/Nexus2.m"
          grep -F 'Backup and restore' "$WORK/Nexus2.m"
          grep -F 'NXFindLeadingIconView' "$WORK/Nexus2.m"
          grep -F 'feedModuleLoaded' "$WORK/Nexus2.m"
          grep -F 'module loaded:' "$WORK/Nexus2.m"
          grep -F 'Loaded' "$WORK/Nexus2.m"
          grep -F 'NXCacheAutomaticFrequency' "$WORK/Nexus2.m"
          grep -F 'NXSetCacheAutomaticFrequency' "$WORK/Nexus2.m"
          grep -F 'UITableViewCellStyleSubtitle' "$WORK/Nexus2.m"
          grep -F 'reloadRowsAtIndexPaths' "$WORK/Nexus2.m"
          grep -F 'IQFKeyOLEDDarkMode' "$WORK/Nexus2.m"
          grep -F 'IQFRefreshOLED' "$WORK/Nexus2.m"
          grep -F 'IQFApplyForcedAppearance' "$WORK/Nexus2.m"
          grep -F 'NXNeutralizeIQFOLEDForcedAppearance' "$WORK/Nexus2.m"
          grep -F 'NXIsIQFOLEDSetting' "$WORK/Nexus2.m"
          grep -F 'iQFace OLED coordination' "$WORK/Nexus2.m"
          grep -F 'NXPreflightDisableIQFOLEDPreference' "$WORK/Nexus2.m"
          grep -F 'appearance routines invoked by Nexus: NO' "$WORK/Nexus2.m"
          ! grep -F '(NXIQFVoidFunction)NXFindSymbol("IQFRefreshOLED")' "$WORK/Nexus2.m"
          ! grep -F '(NXIQFVoidFunction)NXFindSymbol("IQFApplyForcedAppearance")' "$WORK/Nexus2.m"
          ! grep -F 'Safe startup: restored iQFace icon activation' "$WORK/Nexus2.m"
          ctor_block="$(sed -n '/__attribute__((constructor))/,/^}/p' "$WORK/Nexus2.m")"
          ! grep -F 'NXTryInstallFeedHooks();' <<<"$ctor_block"

      - name: Build Nexus 2.0 Beta 2 R3
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          WORK="$RUNNER_TEMP/nexus-2.0-beta1"
          cd "$WORK"
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"

          mkdir -p "$ROOT/nexus2/artifacts-beta1"
          rm -f "$ROOT/nexus2/artifacts-beta1"/*
          DYLIB_PATH="$(find .theos -type f -name Nexus.dylib -print -quit)"
          test -n "$DYLIB_PATH"
          cp "$DYLIB_PATH" "$ROOT/nexus2/artifacts-beta1/Nexus-2.0-Beta2-R3.dylib"

          cd "$ROOT"
          shasum -a 256 nexus2/artifacts-beta1/Nexus-2.0-Beta2-R3.dylib > nexus2/artifacts-beta1/SHA256SUMS.txt
          file nexus2/artifacts-beta1/Nexus-2.0-Beta2-R3.dylib > nexus2/artifacts-beta1/file.txt
          strings -a nexus2/artifacts-beta1/Nexus-2.0-Beta2-R3.dylib > nexus2/artifacts-beta1/strings.txt || true
          otool -D nexus2/artifacts-beta1/Nexus-2.0-Beta2-R3.dylib > nexus2/artifacts-beta1/install-name.txt
          nm -gU nexus2/artifacts-beta1/Nexus-2.0-Beta2-R3.dylib > nexus2/artifacts-beta1/symbols.txt

          grep -F 'Mach-O 64-bit' nexus2/artifacts-beta1/file.txt
          grep -F 'arm64' nexus2/artifacts-beta1/file.txt
          grep -F '@rpath/Nexus.dylib' nexus2/artifacts-beta1/install-name.txt
          grep -F '2.0 Beta 1' nexus2/artifacts-beta1/strings.txt
          grep -F 'NexusHideThreadsPromotions' nexus2/artifacts-beta1/strings.txt
          grep -F 'NexusHideSuggestedPages' nexus2/artifacts-beta1/strings.txt
          grep -F 'NexusHideStoryPeopleSuggestions' nexus2/artifacts-beta1/strings.txt
          grep -F 'NexusActivationMode' nexus2/artifacts-beta1/strings.txt
          grep -F 'NexusBackgroundMode' nexus2/artifacts-beta1/strings.txt
          grep -F 'NexusCustomBackgroundColor' nexus2/artifacts-beta1/strings.txt
          grep -F 'IQFResolvedLanguage' nexus2/artifacts-beta1/strings.txt
          grep -F 'FBNavigationBar' nexus2/artifacts-beta1/strings.txt
          grep -F 'FBMemModelObject' nexus2/artifacts-beta1/strings.txt
          grep -F '2.0 Beta 2 R3' nexus2/artifacts-beta1/strings.txt
          grep -F '_IQFKey' nexus2/artifacts-beta1/strings.txt
          grep -F 'feedUnitType' nexus2/artifacts-beta1/strings.txt
          grep -F 'feed_unit_type' nexus2/artifacts-beta1/strings.txt
          grep -F 'inlineUnitType' nexus2/artifacts-beta1/strings.txt
          grep -F 'wordmark target found' nexus2/artifacts-beta1/strings.txt
          grep -F 'recognizer attached' nexus2/artifacts-beta1/strings.txt
          grep -F '_Nexus2BackgroundHookInstalled' nexus2/artifacts-beta1/symbols.txt
          grep -F '_Nexus2BackgroundCurrentMode' nexus2/artifacts-beta1/symbols.txt
          grep -F '_Nexus2BackgroundEffectActive' nexus2/artifacts-beta1/symbols.txt
          grep -F '_Nexus2AvatarHooksInstalled' nexus2/artifacts-beta1/symbols.txt
          grep -F '_Nexus2LogoActivationAvailable' nexus2/artifacts-beta1/symbols.txt
          grep -F '_Nexus2DiagnosticsText' nexus2/artifacts-beta1/symbols.txt
          grep -F 'lucaspedrosa' nexus2/artifacts-beta1/strings.txt
          grep -F '2.0 Beta 2 R3' nexus2/artifacts-beta1/strings.txt
          grep -F 'IQFTweakSettings' nexus2/artifacts-beta1/strings.txt
          grep -F '2.0 Beta 2 R3' nexus2/artifacts-beta1/strings.txt
          grep -F 'Restoring saved Facebook logo activation immediately' nexus2/artifacts-beta1/strings.txt
          grep -F 'Waiting for feed detection' nexus2/artifacts-beta1/strings.txt
          grep -F 'Technical log' nexus2/artifacts-beta1/strings.txt
          grep -F 'Activation method' nexus2/artifacts-beta1/strings.txt
          grep -F 'Backup and restore' nexus2/artifacts-beta1/strings.txt
          grep -F '2.0 Beta 2 R3' nexus2/artifacts-beta1/strings.txt
          grep -F 'module loaded:' nexus2/artifacts-beta1/strings.txt
          grep -F 'Loaded' nexus2/artifacts-beta1/strings.txt
          grep -F '2.0 Beta 2 R3' nexus2/artifacts-beta1/strings.txt
          grep -F 'Automatic cache frequency changed to' nexus2/artifacts-beta1/strings.txt
          grep -F '2.0 Beta 2 R3' nexus2/artifacts-beta1/strings.txt
          grep -F 'effect active:' nexus2/artifacts-beta1/strings.txt
          grep -F '2.0 Beta 2 R3' nexus2/artifacts-beta1/strings.txt
          grep -F 'IQFKeyOLEDDarkMode' nexus2/artifacts-beta1/strings.txt
          grep -F 'IQFRefreshOLED' nexus2/artifacts-beta1/strings.txt
          grep -F 'IQFApplyForcedAppearance' nexus2/artifacts-beta1/strings.txt
          grep -F 'iQFace OLED coordination' nexus2/artifacts-beta1/strings.txt
          grep -F '2.0 Beta 2 R3' nexus2/artifacts-beta1/strings.txt
          grep -F 'appearance routines invoked by Nexus: NO' nexus2/artifacts-beta1/strings.txt
          grep -F 'iQFace OLED preference neutralized without changing Facebook appearance' nexus2/artifacts-beta1/strings.txt
          grep -F 'Restoring saved Facebook logo activation immediately' nexus2/artifacts-beta1/strings.txt
          grep -F 'Utilit' nexus2/artifacts-beta1/strings.txt || true
          grep -F 'English' nexus2/artifacts-beta1/strings.txt || true

          if grep -F 'IQFEnhancerLocalizationVersion' nexus2/artifacts-beta1/strings.txt; then
            echo "Legacy translation enhancer unexpectedly present"
            exit 1
          fi

      - name: Upload Nexus 2.0 Beta 2 R3
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-2.0-Beta2-R3-arm64
          path: nexus2/artifacts-beta1/
          if-no-files-found: error
          retention-days: 90
