name: Build FBOLED

"on":
  workflow_dispatch:
  push:
    paths:
      - "fboled/**"
      - ".github/workflows/fboled.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: fboled

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: brew install ldid

      - name: Prepare FBOLED 0.2.4 test
        run: |
          set -euo pipefail
          python3 prepare_023.py

      - name: Validate targeted avatar fixes
        run: |
          set -euo pipefail
          grep -F 'FBOLED 0.2.4 TEST' FBOLED.m
          grep -F 'FBOLEDIsUnmaskedAvatarVariant' FBOLED.m
          grep -F 'FBOLEDIsCompositeCommunityAvatarVariant' FBOLED.m
          grep -F 'FBOLEDApplyImmediateCompositeAvatarClip' FBOLED.m
          grep -F 'FBOLEDInstallImmediateAvatarHooks' FBOLED.m
          grep -F 'fboled_avatar_addSubview:' FBOLED.m
          grep -F 'fboled_avatar_setImage:' FBOLED.m
          grep -F 'FDSTouchStateComponentView' FBOLED.m
          grep -F '_FBMaskedRoundedCornerView' FBOLED.m
          grep -F 'MRCImageComponentView' FBOLED.m
          grep -F 'MRCAnimatedImageView' FBOLED.m
          grep -F 'FBOLEDIsUnmaskedAvatarVariant(view) ||' FBOLED.m
          if grep -E 'MSHook|class_replaceMethod|method_setImplementation|rebind_symbols' FBOLED.m; then
            echo "Unexpected new hook mechanism found"
            exit 1
          fi

      - name: Build FBOLED dylib
        run: |
          set -euo pipefail
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          mkdir -p artifacts
          dylib_path="$(find .theos -type f -name FBOLED.dylib -print -quit)"
          test -n "$dylib_path"
          cp "$dylib_path" artifacts/FBOLED.dylib
          file artifacts/FBOLED.dylib | tee artifacts/file.txt
          otool -L artifacts/FBOLED.dylib | tee artifacts/dependencies.txt
          strings artifacts/FBOLED.dylib > artifacts/strings.txt
          grep -F 'Mach-O 64-bit' artifacts/file.txt
          grep -F 'arm64' artifacts/file.txt
          grep -F '_FBMaskedRoundedCornerView' artifacts/strings.txt
          grep -F 'MRCImageComponentView' artifacts/strings.txt
          grep -F 'MRCAnimatedImageView' artifacts/strings.txt
          grep -F 'FDSTouchStateComponentView' artifacts/strings.txt
          grep -F 'fboled_avatar_addSubview:' artifacts/strings.txt
          grep -F 'fboled_avatar_setImage:' artifacts/strings.txt
          shasum -a 256 artifacts/FBOLED.dylib > artifacts/SHA256SUMS.txt

      - name: Upload FBOLED dylib
        uses: actions/upload-artifact@v4
        with:
          name: FBOLED-0.2.4-community-avatar-noflash-test-arm64
          path: fboled/artifacts/
          if-no-files-found: error
          retention-days: 90
