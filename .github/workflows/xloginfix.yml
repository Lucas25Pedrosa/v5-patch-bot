name: Verify XLoginFix

"on":
  workflow_dispatch:
  pull_request:
    paths:
      - "xloginfix/**"
      - ".github/workflows/xloginfix.yml"
  push:
    paths:
      - "xloginfix/**"
      - ".github/workflows/xloginfix.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify canonical dylib
        shell: bash
        run: |
          set -euo pipefail

          dylib="xloginfix/vendor/FahdTwitterLoginBypass.dylib"
          expected="d6a3994fbc78cb41d95e281a230419105bc3ea3d4c55aba646b94ea51dee5a0a"

          if [[ ! -f "$dylib" ]]; then
            echo "Vendor dylib not present yet."
            echo "Expected path: $dylib"
            exit 0
          fi

          actual="$(shasum -a 256 "$dylib" | awk '{print $1}')"
          test "$actual" = "$expected"

          info="$(file "$dylib")"
          echo "$info"
          echo "$info" | grep -F "arm64"
          echo "$info" | grep -F "arm64e"

          strings -a "$dylib" | grep -F "FahdTwitter_oauth_token"
          strings -a "$dylib" | grep -F "private_startLoginFlowWithSender:"
          strings -a "$dylib" | grep -F "buildAndAddAccountWithToken:secret:screenName:userId:"

          mkdir -p xloginfix/artifacts
          cp "$dylib" xloginfix/artifacts/XLoginFix.dylib
          shasum -a 256 xloginfix/artifacts/XLoginFix.dylib > xloginfix/artifacts/SHA256SUMS.txt

      - name: Upload verified dylib
        if: ${{ hashFiles('xloginfix/artifacts/XLoginFix.dylib') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: XLoginFix-1.0.0-arm64-arm64e
          path: xloginfix/artifacts/
          if-no-files-found: error
