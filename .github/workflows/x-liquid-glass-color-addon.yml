name: Build XLiquidGlass 2.0 Color Add-on

"on":
  workflow_dispatch:
  push:
    paths:
      - "x-liquid-glass-color-addon/**"
      - ".github/workflows/x-liquid-glass-color-addon.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: x-liquid-glass-color-addon

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: brew install ldid

      - name: Build color add-on
        run: |
          set -euo pipefail
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          mkdir -p artifacts
          dylib_path="$(find .theos -type f -name XLiquidGlassColorAddon.dylib ! -path '*/XLiquidGlassColorAddon.dylib.dSYM/*' -print -quit)"
          test -n "$dylib_path"
          cp "$dylib_path" artifacts/XLiquidGlass-2.0-ColorAddon-Test1-X12.28.1-arm64.dylib
          file artifacts/XLiquidGlass-2.0-ColorAddon-Test1-X12.28.1-arm64.dylib
          shasum -a 256 artifacts/XLiquidGlass-2.0-ColorAddon-Test1-X12.28.1-arm64.dylib > artifacts/SHA256SUMS.txt

      - name: Upload color add-on
        uses: actions/upload-artifact@v4
        with:
          name: XLiquidGlass-2.0-ColorAddon-Test1-X12.28.1-arm64
          path: x-liquid-glass-color-addon/artifacts/
          if-no-files-found: error
