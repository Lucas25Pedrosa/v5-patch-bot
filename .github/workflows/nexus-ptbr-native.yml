name: Build Nexus 1.0.2 PT-BR Native iQFace 1.2

"on":
  workflow_dispatch:
  push:
    paths:
      - "nexus/**"
      - ".github/workflows/nexus-ptbr-native.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
      - name: Install signing tool
        run: brew install ldid
      - name: Prepare and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          WORK="$RUNNER_TEMP/nexus-ptbr-native-build"
          rm -rf "$WORK" && mkdir -p "$WORK"

          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/636fea8908d802e4189e61fb292c9f42ad668973" \
            | python3 -c 'import sys,json,base64; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' \
            > "$WORK/EnhancerTweak.m"
          python3 nexus-en/prepare_enhancer.py "$WORK/EnhancerTweak.m"
          cp iqface-enhancer-wordmark-beta/WordmarkActivation.m "$WORK/WordmarkActivation.m"
          cp iqface-enhancer-1.1/HideButton11.m "$WORK/HideButton11.m"
          python3 nexus-en/patch_hidebutton.py "$WORK/HideButton11.m"
          sed -i '' '/if (IQF11ContainsIQF(control.accessibilityLabel) ||/,/    }/d' "$WORK/HideButton11.m"
          sed -i '' '/if (IQF11ContainsIQF(item.title) ||/,/    }/d' "$WORK/HideButton11.m"
          sed -i '' 's/if (IQF11ContainsIQF(action)) return YES;/if ([action isEqualToString:@"iqf_tapped"]) return YES;/' "$WORK/HideButton11.m"
          sed -i '' 's/if (IQF11ContainsIQF(actionName)) return YES;/if ([actionName isEqualToString:@"iqf_tapped"]) return YES;/' "$WORK/HideButton11.m"
          sed -i '' '/static BOOL IQF11ContainsIQF(NSString \*value) {/,/^}/d' "$WORK/HideButton11.m"

          python3 nexus/prepare_cache.py iqface-cache/Tweak.m "$WORK/CacheTweak.m"
          python3 nexus/prepare_icons.py iqface-icons/Tweak.m "$WORK/IconsTweak.m"
          cp iqface-icons/IconPicker.m "$WORK/IconsPicker.m"

          cp iqface-oled/Tweak.m "$WORK/Tweak.m"
          (cd "$WORK" && python3 "$ROOT/iqface-oled/prepare_oled.py" && python3 "$ROOT/iqface-oled/prepare_separator.py" && python3 "$ROOT/iqface-oled/finalize_020.py" && python3 "$ROOT/iqface-oled/adapt_iqface11.py" && python3 "$ROOT/iqface-oled/adapt_iqface11_native_icon_switches.py")
          python3 nexus/prepare_oled.py "$WORK/Tweak.m" "$WORK/OLEDTweak.m"
          rm "$WORK/Tweak.m"

          cp nexus/NexusSettings.m "$WORK/NexusSettings.m"
          python3 nexus/patch_presentation_v2.py "$WORK/NexusSettings.m"
          python3 nexus/prepare_makefile_no_translation.py iqface-4in1/Makefile "$WORK/Makefile"

          ! grep -F 'Translation.m' "$WORK/Makefile"
          grep -F 'NexusAvatarFix.m' "$WORK/Makefile"
          grep -F 'NexusVersion102.m' "$WORK/Makefile"

          cd "$WORK"
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          mkdir -p "$ROOT/nexus/artifacts-native"
          rm -f "$ROOT/nexus/artifacts-native"/*
          DYLIB_PATH="$(find .theos -type f -name Nexus.dylib -print -quit)"
          cp "$DYLIB_PATH" "$ROOT/nexus/artifacts-native/Nexus.dylib"
          cd "$ROOT"
          shasum -a 256 nexus/artifacts-native/Nexus.dylib > nexus/artifacts-native/SHA256SUMS.txt
          file nexus/artifacts-native/Nexus.dylib > nexus/artifacts-native/file.txt
          strings -a nexus/artifacts-native/Nexus.dylib > nexus/artifacts-native/strings.txt || true
          otool -D nexus/artifacts-native/Nexus.dylib > nexus/artifacts-native/install-name.txt
          grep -F 'Mach-O 64-bit' nexus/artifacts-native/file.txt
          grep -F 'arm64' nexus/artifacts-native/file.txt
          grep -F '@rpath/Nexus.dylib' nexus/artifacts-native/install-name.txt
          grep -F 'v1.0.2' nexus/artifacts-native/strings.txt
          grep -F 'nexus_avatar_addSubview:' nexus/artifacts-native/strings.txt
          grep -F 'nexus_avatar_setImage:' nexus/artifacts-native/strings.txt
          if grep -F '1.1-core-ptbr' nexus/artifacts-native/strings.txt; then exit 1; fi
          if grep -F 'IQFEnhancerLocalizationVersion' nexus/artifacts-native/strings.txt; then exit 1; fi

      - name: Upload Nexus PT-BR Native
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-1.0.2-PTBR-Native-iQFace-1.2-arm64
          path: nexus/artifacts-native/
          if-no-files-found: error
