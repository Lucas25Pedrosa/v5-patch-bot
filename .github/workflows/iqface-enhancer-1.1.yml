name: Build iQFaceEnhancer 1.1

"on":
  workflow_dispatch:
  push:
    paths:
      - "iqface-enhancer-1.1/**"
      - "iqface-enhancer-wordmark-beta/WordmarkActivation.m"
      - ".github/workflows/iqface-enhancer-1.1.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install ldid
        run: brew install ldid

      - name: Prepare stable Wordmark No-Flash source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/iqface-enhancer-11"
          mkdir -p "$WORK"

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/636fea8908d802e4189e61fb292c9f42ad668973" \
            | python3 -c 'import sys,json,base64; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d["content"]))' \
            > "$WORK/Tweak.m"

          python3 - "$WORK/Tweak.m" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()

          old = "static void IQFOpenSettings(void) {"
          assert old in s
          s = s.replace(old, "void IQFOpenSettings(void) {", 1)

          pattern = r"static void IQFAttachLongPress\(UIView \*view\) \{.*?\n\}"
          replacement = "static void IQFAttachLongPress(UIView *view) {\n    (void)view;\n    (void)IQFGestureAssociationKey;\n    (void)IQFLongPressDuration;\n}"
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          assert n == 1

          needle = "        if (!IQFSafeModeEnabled()) {\n            IQFInstallNavigationItemHooks();\n            IQFInstallTabBarHooks();\n        }\n"
          assert needle in s
          guard = "        IQFReplaceMethod(UIView.class, @selector(addSubview:), (IMP)&IQFAddSubview, (IMP *)&IQFOriginalAddSubview);\n\n"
          s = s.replace(needle, guard + needle, 1)

          assert 'IQFFindSymbol("IQFPresentSettings")' in s
          assert 'IQFPresentLauncherMenu' not in s
          open(p, "w", encoding="utf-8").write(s)
          PY

          cp iqface-enhancer-wordmark-beta/WordmarkActivation.m "$WORK/WordmarkActivation.m"
          cp iqface-enhancer-1.1/Localization11.m "$WORK/Localization11.m"

          cat > "$WORK/Makefile" <<'EOF'
          ARCHS = arm64
          TARGET = iphone:clang:latest:14.0

          include $(THEOS)/makefiles/common.mk

          LIBRARY_NAME = iQFaceEnhancer
          iQFaceEnhancer_FILES = Tweak.m WordmarkActivation.m Localization11.m
          iQFaceEnhancer_FRAMEWORKS = Foundation UIKit QuartzCore
          iQFaceEnhancer_CFLAGS = -fobjc-arc -Wall -Wextra
          iQFaceEnhancer_LDFLAGS = -Wl,-install_name,@rpath/iQFaceEnhancer.dylib
          iQFaceEnhancer_INSTALL_PATH = /Library/MobileSubstrate/DynamicLibraries

          include $(THEOS_MAKE_PATH)/library.mk
          EOF

      - name: Build and validate arm64 dylib
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/iqface-enhancer-11"
          cd "$WORK"
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"

          dylib_path="$(find .theos -type f -name iQFaceEnhancer.dylib -print -quit)"
          test -n "$dylib_path"
          mkdir -p artifacts
          cp "$dylib_path" artifacts/iQFaceEnhancer.dylib
          shasum -a 256 artifacts/iQFaceEnhancer.dylib > artifacts/SHA256SUMS.txt
          file artifacts/iQFaceEnhancer.dylib
          strings -a artifacts/iQFaceEnhancer.dylib > artifacts/strings.txt || true

          require_string() {
            local value="$1"
            if grep -Fq "$value" artifacts/strings.txt; then
              echo "FOUND: $value"
            else
              echo "MISSING REQUIRED: $value"
              exit 1
            fi
          }

          forbid_string() {
            local value="$1"
            if grep -Fq "$value" artifacts/strings.txt; then
              echo "UNEXPECTED: $value"
              exit 1
            else
              echo "ABSENT AS EXPECTED: $value"
            fi
          }

          require_string "IQFPresentSettings"
          require_string "FBNavigationBar"
          require_string "IQFWordmarkTarget"
          require_string "iqf_tapped"
          forbid_string "IQFPresentLauncherMenu"

          if grep -Fq "UILongPressGestureRecognizer" artifacts/strings.txt; then
            echo "INFO: inert long-press metadata retained by linker"
          else
            echo "INFO: long-press metadata stripped"
          fi

          # 0.3.1 must contain only the visual settings translation layer.
          require_string "1.1-scanner-only"
          require_string "IQFSettingsViewController"
          require_string "Abrir links no Safari"
          require_string "Modo fantasma nos stories"
          require_string "Ocultar elementos da tela de Reels"

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: iQFaceEnhancer-0.3.1-iQFace-1.1-scanner-only-arm64
          path: ${{ runner.temp }}/iqface-enhancer-11/artifacts/
          if-no-files-found: error
