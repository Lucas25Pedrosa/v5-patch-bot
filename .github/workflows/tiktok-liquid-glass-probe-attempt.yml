name: Analyze Infinitok Liquid Glass

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/tiktok-liquid-glass-probe-attempt.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download public Infinitok IPA
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            "https://pub-dd800571175348b6a2745b3396360028.r2.dev/TikTok-47.1.0-Infinitok.ipa" \
            -o "$RUNNER_TEMP/infinitok.ipa"

      - name: Extract Infinitok dylib
        run: |
          set -euo pipefail
          mkdir -p analysis-output
          entry="$(unzip -Z1 "$RUNNER_TEMP/infinitok.ipa" | grep -iE '(^|/)Infinitok\.dylib$' | head -1)"
          echo "entry=$entry" | tee analysis-output/ipa-dylib-location.txt
          test -n "$entry"
          unzip -p "$RUNNER_TEMP/infinitok.ipa" "$entry" > "$RUNNER_TEMP/Infinitok.dylib"
          file "$RUNNER_TEMP/Infinitok.dylib" | tee analysis-output/file.txt
          shasum -a 256 "$RUNNER_TEMP/Infinitok.dylib" | tee analysis-output/sha256.txt
          stat -f 'size=%z' "$RUNNER_TEMP/Infinitok.dylib" | tee analysis-output/size.txt

      - name: Mach-O inventory
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/Infinitok.dylib"
          otool -L "$D" > analysis-output/otool-L.txt
          otool -l "$D" > analysis-output/otool-load-commands.txt
          nm -m "$D" > analysis-output/nm-m.txt || true
          nm -u "$D" > analysis-output/nm-undefined.txt || true
          otool -ov "$D" > analysis-output/otool-objc.txt || true
          strings -a -t x "$D" > analysis-output/strings-offsets.txt
          grep -iE 'liquid|glass|tab.?bar|floating|full.?size|fullscreen|immersive|feed|cellHeight|lastStable|BottomMask|player|video|safe.?area|TTK|TUX|AWEFeed|iOS26|solarium' analysis-output/strings-offsets.txt > analysis-output/relevant-strings.txt || true

      - name: Install radare2 analysis tools
        run: |
          set -euo pipefail
          brew install radare2
          python3 -m pip install --user r2pipe

      - name: Cross-reference Liquid Glass strings and hook APIs
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/xrefs.py" <<'PY'
          import json, os, re
          import r2pipe

          path = os.environ['DYLIB']
          out = os.environ['OUT']
          r = r2pipe.open(path, flags=['-2'])
          r.cmd('e anal.timeout=120')
          r.cmd('aaa')

          rx = re.compile(r'(liquid.?glass|isLiquidGlass|TUXExperiments|TTKIOS26|TTKABTest|TTKTabBar|TTKFakeTabBar|tabBarHeight|heightForTabBar|AWENewFeed|AWEFeedCell|TTKFeedTable|BottomMask|full.?size|fullscreen|immersive)', re.I)
          strings = r.cmdj('izzj') or []
          targets=[]
          for s in strings:
              txt=s.get('string','')
              if rx.search(txt):
                  targets.append((s.get('vaddr',0), txt))

          seen_funcs=set()
          with open(out,'w',encoding='utf-8') as f:
              def emit_function(at, why):
                  info=r.cmdj(f'afij @ {at}') or []
                  if not info:
                      f.write(f'  XREF 0x{at:x} no-function {why}\n')
                      return
                  fi=info[0]
                  off=fi.get('offset', at)
                  name=fi.get('name','?')
                  f.write(f'  XREF 0x{at:x} -> FUNC 0x{off:x} {name} size={fi.get("size")} why={why}\n')
                  if off not in seen_funcs:
                      seen_funcs.add(off)
                      f.write(r.cmd(f'pdf @ {off}'))
                      f.write('\n')

              for addr, txt in targets:
                  f.write(f'\n===== STRING 0x{addr:x}: {txt} =====\n')
                  refs=r.cmdj(f'axtj @ {addr}') or []
                  f.write(f'refs={len(refs)}\n')
                  for ref in refs[:30]:
                      emit_function(ref.get('from',0), f'string:{txt}')

              f.write('\n===== IMPORT XREFS =====\n')
              syms=r.cmdj('isj') or []
              wanted=re.compile(r'(MSHookMessageEx|method_setImplementation|class_getInstanceMethod|class_addMethod|objc_getClass|class_copyMethodList)', re.I)
              for sym in syms:
                  name=sym.get('name','')
                  if not wanted.search(name):
                      continue
                  addr=sym.get('vaddr',0)
                  f.write(f'\n--- IMPORT {name} @ 0x{addr:x} ---\n')
                  refs=r.cmdj(f'axtj @ {addr}') or []
                  for ref in refs[:100]:
                      emit_function(ref.get('from',0), f'import:{name}')
          r.quit()
          PY
          DYLIB="$RUNNER_TEMP/Infinitok.dylib" OUT="analysis-output/r2-liquid-glass-xrefs.txt" python3 "$RUNNER_TEMP/xrefs.py"

      - name: Extract exact settings neighbourhood
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          p='analysis-output/strings-offsets.txt'
          rows=[]
          for line in open(p, errors='ignore'):
              m=re.match(r'\s*([0-9a-fA-F]+)\s+(.*)', line.rstrip('\n'))
              if m: rows.append((int(m.group(1),16),m.group(2)))
          anchors=['liquid_glass_enabled','isLiquidGlassButtonEnabled','patched %lu TUXExperiments gates','INFINITOK [glass]']
          with open('analysis-output/string-neighbourhoods.txt','w') as o:
              for anchor in anchors:
                  idx=[i for i,(_,s) in enumerate(rows) if anchor.lower() in s.lower()]
                  for i in idx:
                      o.write(f'===== {anchor} @ 0x{rows[i][0]:x} =====\n')
                      for a,s in rows[max(0,i-25):min(len(rows),i+35)]: o.write(f'{a:08x} {s}\n')
          PY

      - name: Print targeted results
        run: |
          echo '=== FILE ==='
          cat analysis-output/file.txt analysis-output/sha256.txt analysis-output/size.txt
          echo '=== RELEVANT STRINGS ==='
          cat analysis-output/relevant-strings.txt | head -n 800
          echo '=== STRING NEIGHBOURHOODS ==='
          cat analysis-output/string-neighbourhoods.txt | head -n 1000
          echo '=== R2 XREFS ==='
          cat analysis-output/r2-liquid-glass-xrefs.txt | head -n 5000

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: Infinitok-LiquidGlass-Xref-Analysis
          path: analysis-output/
          if-no-files-found: error
