name: Build XLiquidGlass 12.38 Probe v2.5

"on":
  workflow_dispatch:
  push:
    paths:
      - "x-liquid-glass-1238-probe-v25/**"
      - ".github/workflows/x-liquid-glass-1238-probe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ldid
        run: brew install ldid

      - name: Build probe v2.5 dylib
        working-directory: x-liquid-glass-1238-probe-v25
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -fobjc-arc \
            -fblocks \
            -framework Foundation \
            -framework UIKit \
            -Wl,-undefined,dynamic_lookup \
            XLiquidGlass1238ProbeV25.m \
            -o XLiquidGlass1238ProbeV25.dylib
          ldid -S XLiquidGlass1238ProbeV25.dylib
          mkdir -p artifacts
          cp XLiquidGlass1238ProbeV25.dylib artifacts/
          file artifacts/XLiquidGlass1238ProbeV25.dylib
          shasum -a 256 artifacts/XLiquidGlass1238ProbeV25.dylib > artifacts/SHA256SUMS.txt
          printf 'XLiquidGlass1238ProbeV25\nVersion: 2.5\nTarget: X 12.38\nStandalone: yes\nRequires XLiquidGlassNative: no\nPurpose: direct XAppearance.setLiquidGlassRedesignGate(true), no broad runtime scanning\n' > artifacts/BUILD_INFO.txt

      - name: Upload probe v2.5
        uses: actions/upload-artifact@v4
        with:
          name: XLiquidGlass1238Probe-2.5-X12.38-arm64
          path: x-liquid-glass-1238-probe-v25/artifacts/
          if-no-files-found: error
