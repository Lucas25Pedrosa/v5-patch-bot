name: Build XLiquidGlass

"on":
  workflow_dispatch:
  push:
    paths:
      - "x-liquid-glass-only/**"
      - ".github/workflows/x-liquid-glass-only.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: x-liquid-glass-only

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Theos
        run: git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"

      - name: Install signing tool
        run: brew install ldid

      - name: Build standalone Liquid Glass dylib
        run: |
          set -euo pipefail
          make clean all FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos"
          mkdir -p artifacts
          dylib_path="$(find .theos -type f -name XLiquidGlass.dylib ! -path '*/XLiquidGlass.dylib.dSYM/*' -print -quit)"
          test -n "$dylib_path"
          cp "$dylib_path" artifacts/XLiquidGlass.dylib
          file artifacts/XLiquidGlass.dylib
          shasum -a 256 artifacts/XLiquidGlass.dylib > artifacts/SHA256SUMS.txt

      - name: Upload standalone dylib
        uses: actions/upload-artifact@v4
        with:
          name: XLiquidGlass-2.0.1-Beta4-X12.31-arm64
          path: x-liquid-glass-only/artifacts/
          if-no-files-found: error

      - name: Publish Beta 4 build
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p build-output/xlg-2.0.1-beta4-x12.31
          cp x-liquid-glass-only/artifacts/XLiquidGlass.dylib build-output/xlg-2.0.1-beta4-x12.31/XLiquidGlass.dylib
          cp x-liquid-glass-only/artifacts/SHA256SUMS.txt build-output/xlg-2.0.1-beta4-x12.31/SHA256SUMS.txt
          printf '%s\n' "$GITHUB_RUN_ID" > build-output/xlg-2.0.1-beta4-x12.31/RUN_ID.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/xlg-2.0.1-beta4-x12.31/XLiquidGlass.dylib build-output/xlg-2.0.1-beta4-x12.31/SHA256SUMS.txt build-output/xlg-2.0.1-beta4-x12.31/RUN_ID.txt
          if ! git diff --cached --quiet; then
            git commit -m "Build XLiquidGlass 2.0.1 Beta 4 for X 12.31"
            git push
          fi
